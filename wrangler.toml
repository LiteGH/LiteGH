name = "litegh"
main = "worker.mjs"
compatibility_date = "2026-10-21"
workers_dev = false
routes = [{ pattern = "litegh.com/*", zone_name = "litegh.com" }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[kv_namespaces]]
binding = "REPO_SNAPSHOTS"
id = "a2062c5b40c64e648141e897823021eb"

[cache]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
