  <style>
    :root {
      --font-size: 16px;
      --font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sidebar-width: 18rem;
      --topbar-height: 3.5rem;
      --radius-sm: 0.45rem;
      --radius-md: 0.7rem;
      --radius-lg: 0.95rem;
      --shadow: 0 0.45rem 1.4rem rgba(15, 23, 42, 0.08);
      --transition: 160ms ease;

      --page-bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #f0f2f7;
      --surface-3: #e8ebf2;
      --text: #172033;
      --muted: #687389;
      --border: #dde2eb;
      --accent: #2563eb;
      --accent-soft: #e8efff;
      --accent-strong: #1d4ed8;
      --on-accent: #ffffff;
      --success: #16804d;
      --warning-bg: #fff7db;
      --warning-border: #e7c65c;
      --error-bg: #fff0f0;
      --error-border: #e05252;
      --code-bg: #f6f8fb;
      --focus: 0 0 0 0.18rem rgba(37, 99, 235, 0.22);
    }

    body.dark-mode {
      --page-bg: #0f1420;
      --surface: #171d2b;
      --surface-2: #1e2635;
      --surface-3: #273146;
      --text: #f1f5fb;
      --muted: #a4aec0;
      --border: #30394a;
      --accent: #67a2ff;
      --accent-soft: #1f3151;
      --accent-strong: #8db8ff;
      --on-accent: #08111f;
      --success: #51d18a;
      --warning-bg: #2e290f;
      --warning-border: #5f5625;
      --error-bg: #331717;
      --error-border: #a94c4c;
      --code-bg: #111827;
      --focus: 0 0 0 0.18rem rgba(103, 162, 255, 0.25);
    }

    html {
      font-size: var(--font-size);
      scrollbar-color: var(--surface-3) transparent;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: var(--font-family);
      color: var(--text);
      background: var(--page-bg);
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    a {
      color: var(--accent);
    }

    .app-shell {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: var(--topbar-height);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.8rem;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 92%, var(--page-bg));
      position: relative;
      z-index: 10;
      backdrop-filter: blur(0.75rem);
    }

    .ui-icon {
      width: 1rem;
      height: 1rem;
      flex: 0 0 1rem;
      display: block;
    }

    .ui-icon-lg {
      width: 1.05rem;
      height: 1.05rem;
      flex-basis: 1.05rem;
    }

    .repo-search {
      display: flex;
      position: relative;
      flex: 0 1 26rem;
      min-width: 12rem;
      margin-left: 0.35rem;
    }

    .repo-search-inner {
      position: absolute;
      width: 100%;
      transform: translateY(-50%);
    }

    .repo-search .ui-icon {
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .repo-search input {
      width: 100%;
      height: 2rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      padding: 0.45rem 0.15rem 0.45rem 2.15rem;
      font-size: 0.82rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .repo-search input::placeholder {
      color: var(--muted);
    }

    .repo-search input:focus {
      border-color: var(--accent);
      box-shadow: var(--focus);
      background: var(--surface);
    }

    .repo-search input.is-invalid {
      border-color: var(--error-border);
    }

    .repo-search-results {
      position: absolute;
      top: calc(100% + 0.45rem);
      left: 0;
      right: 0;
      z-index: 20;
      max-height: min(32rem, 70vh);
      overflow: auto;
      padding: 0.35rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .repo-search-result,
    .repo-search-empty {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      border-radius: 0.55rem;
    }

    .repo-search-result {
      padding: 0.55rem;
      cursor: pointer;
    }

    .repo-search-result:hover,
    .repo-search-result.active {
      background: var(--surface-2);
    }

    .repo-search-result-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }

    .repo-avatar {
      width: 2rem;
      height: 2rem;
      flex: 0 0 2rem;
      border-radius: 0.45rem;
      object-fit: cover;
      background: var(--surface-2);
    }

    .repo-search-name {
      min-width: 0;
      flex: 1;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .repo-search-meta {
      display: flex;
      gap: 0.65rem;
      margin: 0.22rem 0 0 2.5rem;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .repo-search-description {
      margin: 0.3rem 0 0 2.5rem;
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .repo-search-empty {
      padding: 0.75rem;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .brand-button {
      border: 0;
      background: transparent;
      padding: 0.2rem;
      cursor: pointer;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-mark {
      width: 1.5rem;
      height: 1.5rem;
      flex: 0 0 auto;
      display: block;
    }

    .brand-copy {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      min-width: 0;
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-name span {
      color: #1a69fb;
    }

    .repo-title {
      min-width: 0;
      max-width: min(52vw, 40rem);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .repo-link {
      color: inherit;
      text-decoration: none;
    }

    .repo-link:hover {
      color: var(--accent);
    }

    .topbar-spacer {
      flex: 1;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.28rem;
    }

    .icon-btn,
    .toolbar-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 0.55rem;
      min-width: 2rem;
      height: 2rem;
      padding: 0 0.48rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), border-color var(--transition), color var(--transition), transform var(--transition);
    }

    .icon-btn:hover,
    .toolbar-btn:hover,
    .icon-btn.active,
    .toolbar-btn.active {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }

    .icon-btn:active,
    .toolbar-btn:active {
      transform: translateY(0.04rem);
    }

    #btnInstall[hidden] { display: none; }

    .rate-badge {
      display: none;
      font-variant-numeric: tabular-nums;
      font-size: 0.72rem;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 999px;
      padding: 0.2rem 0.45rem;
      margin-left: 0.2rem;
    }

    .rate-badge.low {
      display: inline-flex;
      color: var(--text);
      background: var(--warning-bg);
      border-color: var(--warning-border);
    }

    .rate-badge.critical {
      display: inline-flex;
      color: var(--text);
      background: var(--error-bg);
      border-color: var(--error-border);
    }

    .branch-control {
      position: relative;
    }

    .branch-button {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 999px;
      padding: 0.26rem 0.52rem;
      font-size: 0.74rem;
      line-height: 1.2;
      cursor: pointer;
      max-width: 10rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-button:hover,
    .branch-button[aria-expanded="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    .branch-menu {
      position: absolute;
      top: calc(100% + 0.3rem);
      left: 0;
      z-index: 30;
      width: min(16rem, 78vw);
      max-height: 16rem;
      overflow: auto;
      padding: 0.2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
    }

    .branch-menu .notice {
      padding: 0.3rem 0.42rem;
      margin-bottom: 0;
      font-size: 0.72rem;
      line-height: 1.15;
    }

    .branch-option {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 0.34rem;
      padding: 0.3rem 0.42rem;
      text-align: left;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.72rem;
      line-height: 1.15;
    }

    .branch-option:hover,
    .branch-option.is-current {
      background: var(--accent-soft);
      color: var(--accent);
    }

    #btnExpand .ui-icon {
      transition: transform var(--transition);
    }

    #btnExpand.is-expanded .ui-icon {
      transform: rotate(180deg);
    }

    .workspace {
      min-height: 0;
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex: 0 0 var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }

    .sidebar.hidden {
      display: none;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.7rem 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .file-count {
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .filter-wrap {
      padding: 0.65rem 0.65rem 0.55rem;
    }

    .filter-box {
      position: relative;
    }

    .filter-box input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 0.6rem;
      padding: 0.52rem 2rem 0.52rem 0.68rem;
      font-size: 0.82rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .filter-box input:focus {
      border-color: var(--accent);
      box-shadow: var(--focus);
      background: var(--surface);
    }

    .filter-clear {
      position: absolute;
      right: 0.35rem;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 0.4rem;
      display: none;
    }

    .filter-clear:hover {
      background: var(--surface-3);
      color: var(--text);
    }

    .tree {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 0.15rem 0.45rem 0.7rem;
      contain: content;
      overscroll-behavior: contain;
    }

    .tree-folder,
    .tree-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.32rem;
      min-height: 1.7rem;
      width: 100%;
      border-radius: 0.38rem;
      padding: 0.19rem 0.45rem;
      margin: 0.02rem 0;
      color: var(--text);
      font-family: var(--font-family);
      font-size: 0.76rem;
      line-height: 1.15;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      text-align: left;
    }

    .tree-folder {
      list-style: none;
    }

    .tree-folder::-webkit-details-marker {
      display: none;
    }

    .tree-folder:hover,
    .tree-item:hover {
      background: var(--surface-2);
    }

    .tree-item.active {
      background: var(--accent-soft);
      color: var(--accent-strong);
      border-color: color-mix(in srgb, var(--accent), transparent 72%);
    }

    .tree-folder.is-hidden,
    .tree-item.is-hidden,
    .tree-placeholder.is-hidden {
      display: none;
    }

    .tree-item-main {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 0.3rem;
      flex: 1;
    }

    .tree-icon {
      width: 0.92rem;
      flex: 0 0 0.92rem;
      text-align: center;
      opacity: 0.9;
    }

    .file-kind {
      opacity: 0.95;
    }
    .kind-js, .kind-ts { color: #e8b931; }
    .kind-json, .kind-data { color: #bd8cff; }
    .kind-html { color: #e66b2e; }
    .kind-css { color: #4d8ff7; }
    .kind-markdown { color: #6f7dff; }
    .kind-python { color: #4f9fdd; }
    .kind-shell { color: #5cae72; }
    .kind-image { color: #bb70d3; }
    .kind-audio { color: #c970a9; }
    .kind-video { color: #d97c61; }
    .kind-pdf { color: #d65d63; }
    .kind-sheet { color: #56a36c; }
    .kind-archive { color: #ae8c57; }

    .tree-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-size {
      flex: 0 0 auto;
      font-family: var(--font-family);
      color: var(--muted);
      font-size: 0.68rem;
    }

    .folder-placeholder {
      padding: 0.35rem 0.55rem 0.45rem 2.2rem;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.35;
    }

    .folder-placeholder.error {
      color: var(--error-border);
    }

    .tree-indent-1 { padding-left: 0.82rem; }
    .tree-indent-2 { padding-left: 1.54rem; }
    .tree-indent-3 { padding-left: 2.26rem; }
    .tree-indent-4 { padding-left: 2.98rem; }

    .tree-folder > summary::before {
      content: "›";
      display: inline-block;
      width: 0.85rem;
      margin-right: 0.05rem;
      color: var(--muted);
      transition: transform var(--transition);
    }

    .tree-folder[open] > summary::before {
      transform: rotate(90deg);
    }

    .tree-folder-icon {
      color: var(--accent);
    }

    .sidebar-foot {
      padding: 0.45rem 0.65rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      background: var(--surface);
    }

    .mini-btn {
      border: 0;
      width: 100%;
      border-radius: 0.5rem;
      padding: 0.36rem 0.5rem;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.74rem;
    }

    .mini-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .resizer {
      width: 0.25rem;
      flex: 0 0 0.25rem;
      cursor: col-resize;
      background: transparent;
      transition: background var(--transition);
      touch-action: none;
    }

    .resizer:hover,
    .resizer.dragging {
      background: var(--accent);
    }

    .content {
      min-width: 0;
      min-height: 0;
      flex: 1;
      overflow: auto;
      background: var(--page-bg);
      scroll-behavior: smooth;
    }

    .content-inner {
      width: min(78rem, 100%);
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
    }

    .content-head {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 -1.25rem;
      padding: 0.7rem 1.25rem;
      min-height: 3.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: color-mix(in srgb, var(--page-bg) 90%, transparent);
      backdrop-filter: blur(0.7rem);
      border-bottom: 1px solid color-mix(in srgb, var(--border), transparent 40%);
    }

    .breadcrumbs {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.34rem;
      color: var(--muted);
      font-size: 0.8rem;
      overflow: hidden;
    }

    .breadcrumbs span,
    .breadcrumbs a {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breadcrumbs a {
      color: var(--muted);
      text-decoration: none;
    }

    .breadcrumbs a:hover {
      color: var(--accent);
    }

    .crumb-file {
      color: var(--text);
      font-weight: 700;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex: 0 0 auto;
    }

    .file-action {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      height: 2rem;
      min-width: 2rem;
      padding: 0 0.55rem;
      border-radius: 0.52rem;
      font-size: 0.76rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .file-action:hover,
    .file-action[aria-pressed="true"] {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent), var(--border) 45%);
      background: var(--accent-soft);
    }

    .content-body {
      padding: 1.55rem 0 0;
    }

    .empty-state,
    .info-card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .empty-state {
      max-width: 44rem;
      margin: 4rem auto;
      padding: 2.4rem;
      text-align: center;
    }

    .empty-state h1 {
      margin: 0 0 0.55rem;
      font-size: 1.7rem;
      letter-spacing: -0.025em;
    }

    .empty-state p {
      margin: 0.35rem 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .repo-form {
      max-width: 38rem;
      margin: 3rem auto;
      padding: 1.35rem;
    }

    .form-stack {
      display: grid;
      gap: 0.65rem;
    }

    .form-label {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 700;
    }

    .form-input {
      width: 100%;
      padding: 0.62rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 0.58rem;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: var(--focus);
    }

    .primary-btn,
    .secondary-btn {
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      padding: 0.58rem 0.76rem;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .primary-btn {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
    }

    .primary-btn:hover {
      background: var(--accent-strong);
    }

    .secondary-btn {
      background: var(--surface);
      color: var(--text);
    }

    .secondary-btn:hover {
      background: var(--surface-2);
    }

    .markdown-body {
      max-width: 54rem;
      margin: 0 auto;
      padding: 0 0.4rem;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      scroll-margin-top: 5rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .markdown-body h1 {
      font-size: 2rem;
      margin: 0 0 1rem;
    }

    .markdown-body h2 {
      font-size: 1.45rem;
      margin-top: 2rem;
    }

    .markdown-body h3 {
      font-size: 1.15rem;
      margin-top: 1.6rem;
    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre {
      margin-top: 0.9rem;
      margin-bottom: 0.9rem;
    }

    .markdown-body img {
      max-width: 100%;
      height: auto;
      border-radius: 0.7rem;
      border: 1px solid var(--border);
    }

    .markdown-body blockquote {
      margin-left: 0;
      padding: 0.2rem 0 0.2rem 1rem;
      border-left: 0.2rem solid var(--border);
      color: var(--muted);
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--surface-2);
      border-radius: 0.35rem;
      padding: 0.12rem 0.28rem;
    }

    .markdown-body pre {
      overflow: auto;
      padding: 0;
      background: transparent;
    }

    .markdown-body pre code {
      display: block;
      padding: 1rem;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      line-height: 1.55;
    }

    body.dark-mode .markdown-body pre code,
    body.dark-mode pre code.hljs {
      background: var(--code-bg);
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow: auto;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--border);
      padding: 0.48rem 0.65rem;
      vertical-align: top;
      text-align: left;
    }

    .markdown-body th {
      background: var(--surface-2);
    }

    .markdown-body kbd,
    kbd {
      font-family: var(--font-mono);
      font-size: 0.75em;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-bottom-width: 0.14rem;
      border-radius: 0.3rem;
      padding: 0.1rem 0.3rem;
    }

    .source-block {
      margin: 0 auto;
      width: min(70rem, 100%);
    }

    .source-block pre {
      margin: 0;
      overflow: auto;
      padding: 1.1rem;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      background: var(--code-bg);
      line-height: 1.55;
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }

    .media-frame {
      min-height: 20rem;
      display: grid;
      place-items: center;
      padding: 1.2rem;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      background: var(--surface);
    }

    .media-content {
      display: block;
      max-width: 100%;
      max-height: 72vh;
      margin: 0 auto;
      border-radius: 0.55rem;
    }

    audio.media-content,
    video.media-content {
      width: min(52rem, 100%);
    }

    .pdf-frame,
    .html-frame {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      background: var(--surface);
    }

    .pdf-frame {
      min-height: 78vh;
    }

    .html-frame {
      height: min(72vh, 48rem);
    }

    .notice {
      padding: 0.78rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      background: var(--surface-2);
      color: var(--muted);
      margin-bottom: 0.9rem;
      font-size: 0.78rem;
    }

    .notice.warning {
      background: var(--warning-bg);
      border-color: var(--warning-border);
      color: var(--text);
    }

    .notice.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--text);
    }

    .info-card {
      max-width: 52rem;
      margin: 1rem auto 2.5rem;
      padding: 1.2rem;
    }

    .info-card h2 {
      margin: 0 0 0.85rem;
      font-size: 1.3rem;
    }

    .info-card h3 {
      margin: 1.6rem 0 0.5rem;
      font-size: 0.95rem;
    }

    .info-card p,
    .info-card li {
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .info-card ul,
    .info-card ol {
      padding-left: 1.2rem;
    }

    .info-card hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 1.2rem 0;
    }

    .token-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .token-row .form-input {
      flex: 1 1 20rem;
    }

    .sheet {
      width: 100%;
      margin-bottom: 1.4rem;
    }

    .sheet h3 {
      margin: 0 0 0.55rem;
      font-size: 0.85rem;
    }

    .sheet table {
      width: 100%;
      border-collapse: collapse;
      overflow: auto;
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
    }

    .sheet th,
    .sheet td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      text-align: left;
      white-space: nowrap;
      font-size: 0.72rem;
    }

    .sheet th {
      background: var(--surface-2);
      font-weight: 700;
    }

    .selftest-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      overflow: hidden;
    }

    .selftest-table th,
    .selftest-table td {
      border-bottom: 1px solid var(--border);
      padding: 0.45rem 0.55rem;
      text-align: left;
      vertical-align: top;
      font-size: 0.75rem;
    }

    .selftest-table th {
      background: var(--surface-2);
    }

    .selftest-table tr.fail {
      background: var(--error-bg);
    }

    .selftest-table tr.skip {
      background: var(--warning-bg);
    }

    .back-top {
      position: fixed;
      right: 1.2rem;
      bottom: 1.2rem;
      width: 2.3rem;
      height: 2.3rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: none;
      place-items: center;
    }

    .back-top:hover {
      color: var(--accent);
    }

    .app-footer {
      width: min(78rem, 100%);
      margin: 2rem auto 0;
      padding: 0.75rem 0.4rem 0;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.72rem;
      border-top: 1px solid var(--border);
    }

    .app-footer a {
      color: inherit;
      text-decoration: none;
    }

    .app-footer a:hover {
      color: var(--accent);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .repo-search {
        flex: 0 1 2.45rem;
        width: 2.45rem;
        min-width: 2.45rem;
        max-width: 42vw;
        margin-left: 0.05rem;
      }

      .repo-search-inner {
        transition: width var(--transition), flex-basis var(--transition);
      }

      .repo-search:hover .repo-search-inner,
      .repo-search:focus-within .repo-search-inner {
        flex-basis: min(24rem, 42vw);
        width: min(24rem, 42vw);
      }

      .repo-title {
        display: inline;
        max-width: min(30vw, 12rem);
      }

      .content-inner {
        padding-inline: 0.9rem;
      }
      .content-head {
        margin-inline: -0.9rem;
        padding-inline: 0.9rem;
      }
    }

    @media (max-width: 720px) {
      .toolbar {
        gap: 0.15rem;
      }
      .toolbar-btn {
        min-width: 1.9rem;
      }
      .sidebar {
        width: min(66vw, 15rem);
        flex-basis: min(66vw, 15rem);
      }
      .resizer {
        width: 0;
        flex-basis: 0;
      }
      .workspace .sidebar.hidden + .resizer {
        display: none;
      }
      .content-head {
        align-items: flex-start;
        flex-direction: column;
      }
      .file-actions {
        width: 100%;
        overflow: auto;
      }
      .file-action {
        min-width: 2rem;
        width: 2rem;
        padding-inline: 0;
        flex: 0 0 2rem;
      }
      .file-action span {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        padding-inline: 0.55rem;
      }
      .repo-search,
      .repo-search:hover,
      .repo-search:focus-within {
        flex-basis: 2.3rem;
        width: 2.3rem;
        min-width: 2.3rem;
        max-width: 42vw;
      }
      .repo-search:hover .repo-search-inner,
      .repo-search:focus-within .repo-search-inner {
        flex-basis: 42vw;
        width: 42vw;
      }
      .brand-copy {
        gap: 0.28rem;
      }
      .brand-name {
        font-size: 0.95rem;
      }
      .repo-title {
        max-width: 18vw;
        font-size: 0.72rem;
      }
      .sidebar {
        width: min(58vw, 14rem);
        flex-basis: min(58vw, 14rem);
      }
      .icon-btn,
      .toolbar-btn {
        min-width: 1.85rem;
        padding-inline: 0.35rem;
      }
      .rate-badge {
        display: none !important;
      }
      .content-inner {
        padding-bottom: 2rem;
      }
    }

    @media print {
      body,
      body.dark-mode {
        --page-bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --text: #000000;
        --muted: #444444;
        --border: #bbbbbb;
        --code-bg: #ffffff;
      }
      .topbar,
      .sidebar,
      .resizer,
      .content-head,
      .back-top,
      .app-footer {
        display: none !important;
      }
      body,
      .workspace,
      .content,
      .content-inner {
        height: auto;
        overflow: visible;
        display: block;
      }
      .content-inner {
        width: 100%;
        padding: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="btnSidebar" class="icon-btn" type="button" title="Toggle sidebar (Ctrl/⌘ B)" aria-label="Toggle sidebar" aria-expanded="true"><svg class="ui-icon ui-icon-lg" aria-hidden="true"><use href="#i-menu"></use></svg></button>
      <button id="brandButton" class="brand-button" type="button" title="Go to home">
        <img class="brand-mark" src="/icons/icon-32.png" alt="">
        <span class="brand-copy">
          <span class="brand-name">Lite<span>GH</span></span>
          <span id="repoTitle" class="repo-title"></span>

      <form id="repoSearch" class="repo-search" role="search" autocomplete="off">

      <div class="topbar-spacer"></div>

      <div class="toolbar">
        <button id="rateBadge" class="rate-badge" type="button" title="GitHub API rate limit"></button>
        <button id="btnDark" class="toolbar-btn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false"><svg class="ui-icon" aria-hidden="true"><use id="darkModeIcon" href="#i-moon"></use></svg></button>

      </div>
    </header>

    <main class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="Repository files">
        <div class="sidebar-head">
          <div id="branchControl" class="branch-control" hidden>
            <button id="btnBranch" class="branch-button" type="button" aria-haspopup="listbox" aria-expanded="false" title="Switch branch"></button>
            <div id="branchMenu" class="branch-menu" role="listbox" aria-label="Branches" hidden></div>

          <div id="fileCount" class="file-count">—</div>
