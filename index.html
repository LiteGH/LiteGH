    const updateTopButtonState = () => {
      $('btnAbout').classList.toggle('active', state.activePanel === 'about');
      $('btnAbout').setAttribute('aria-pressed', String(state.activePanel === 'about'));
      $('btnToken').classList.toggle('active', state.activePanel === 'token');
      $('btnToken').setAttribute('aria-pressed', String(state.activePanel === 'token'));
    };

    const resetAllData = () => {
      const prefix = `${CONFIG.storagePrefix}:${location.pathname}:`;
      try {
        const keys = Object.keys(localStorage).filter((key) => key.startsWith(prefix));
        keys.forEach((key) => localStorage.removeItem(key));
      } catch (_) { /* storage blocked */ }
      try {
        const keys = Object.keys(sessionStorage).filter((key) => key.startsWith(prefix));
        keys.forEach((key) => sessionStorage.removeItem(key));
      } catch (_) { /* storage blocked */ }
      location.reload();
    };

    const getVisibleTreeNodes = () => Array.from(document.querySelectorAll('.tree-item, .folder-wrap > summary')).filter((node) => {
      if (node.closest('.folder-wrap')?.classList.contains('is-hidden')) return false;
      if (node.classList.contains('tree-item') && node.classList.contains('is-hidden')) return false;
      const parent = node.parentElement?.closest('details');
      if (parent && !parent.open) return false;
      return true;
    });

    const focusTreeSelection = () => {
      const target = treeRows.find((row) => row.dataset.path === state.currentFilePath) || getVisibleTreeNodes()[0];
      target?.focus();
    };

    const handleTreeKeydown = (event) => {
      const items = getVisibleTreeNodes();
      if (!items.length) return;
      const current = document.activeElement;
      const index = items.indexOf(current);
      const focusItem = (item, selectFileToo = true) => {
        if (!item) return;
        item.focus();
        item.scrollIntoView({ block: 'nearest' });
        if (selectFileToo && item.classList.contains('tree-item')) selectFile(item.dataset.path);
      };

      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const next = event.key === 'ArrowDown' ? Math.min(items.length - 1, Math.max(0, index) + 1) : Math.max(0, Math.max(0, index) - 1);
        focusItem(items[next]);
      } else if (event.key === 'PageDown' || event.key === 'PageUp') {
        event.preventDefault();
        const rowHeight = current?.getBoundingClientRect().height || 32;
        const page = Math.max(1, Math.floor($('tree').clientHeight / rowHeight) - 1);
        const delta = event.key === 'PageDown' ? page : -page;
        const next = Math.max(0, Math.min(items.length - 1, Math.max(0, index) + delta));
        focusItem(items[next]);
      } else if (event.key === 'Home' || event.key === 'End') {
        event.preventDefault();
        focusItem(event.key === 'Home' ? items[0] : items[items.length - 1]);
      } else if (event.key === 'Enter' && current?.classList.contains('tree-item')) {
        event.preventDefault();
        selectFile(current.dataset.path);
      } else if (event.key === 'ArrowRight' && current?.closest('details')) {
        const details = current.closest('details');
        if (!details.open) {
          event.preventDefault();
          details.open = true;
        }
      } else if (event.key === 'ArrowLeft' && current?.closest('details')) {
        const details = current.closest('details');
        if (details.open) {
          event.preventDefault();
          details.open = false;
          details.querySelector(':scope > summary')?.focus();
        }
      }
    };

    const setupResizer = () => {
      const saved = safeGet(localStorage, storageKey('sidebarWidth'));
      if (saved) document.documentElement.style.setProperty('--sidebar-width', saved);
      let dragging = false;
      $('resizer').addEventListener('pointerdown', (event) => {
        dragging = true;
        $('resizer').classList.add('dragging');
        $('resizer').setPointerCapture(event.pointerId);
      });
      $('resizer').addEventListener('pointermove', (event) => {
        if (!dragging) return;
        const min = 12;
        const max = Math.max(min, Math.min(26, (window.innerWidth - 16) / 16));
        const rem = Math.min(max, Math.max(min, event.clientX / parseFloat(getComputedStyle(document.documentElement).fontSize)));
        document.documentElement.style.setProperty('--sidebar-width', `${rem}rem`);
      });
      $('resizer').addEventListener('pointerup', () => {
        dragging = false;
        $('resizer').classList.remove('dragging');
        safeSet(localStorage, storageKey('sidebarWidth'), getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width').trim());
      });
    };

    const setupAppearance = () => {
      const darkStored = safeGet(localStorage, storageKey('darkMode'));
      const dark = darkStored == null ? window.matchMedia('(prefers-color-scheme: dark)').matches : darkStored === 'true';
      applyDarkMode(dark);
      const font = Number.parseInt(safeGet(localStorage, storageKey('fontSize')) || '', 10);
      if (font) document.documentElement.style.setProperty('--font-size', `${Math.min(36, Math.max(10, font))}px`);
    };

    const applyDarkMode = (enabled) => {
      document.body.classList.toggle('dark-mode', enabled);
      $('darkModeIcon').setAttribute('href', enabled ? '#i-sun' : '#i-moon');
      $('btnDark').setAttribute('aria-pressed', String(enabled));
      updateHighlightThemeLinks();
      if (window.hljs) ensureHighlight().catch(() => {});
      safeSet(localStorage, storageKey('darkMode'), String(enabled));
    };

    const closeRepoSearch = () => {
      const panel = $('repoSearchResults');
      panel.hidden = true;
      $('repoSearchInput').setAttribute('aria-expanded', 'false');
      state.repoSearchActiveIndex = -1;
    };

    const renderRepoSearchResults = (items, message = '') => {
      const panel = $('repoSearchResults');
      state.repoSearchResults = items || [];
      state.repoSearchActiveIndex = -1;
      if (message) {
        panel.innerHTML = `<div class="repo-search-empty">${escapeHTML(message)}</div>`;
      } else if (!items?.length) {
        panel.innerHTML = '<div class="repo-search-empty">No repositories found.</div>';
      } else {
        panel.innerHTML = items.map((item, index) => {
          const description = item.description || 'No description';
          const language = item.language || '—';
          const avatarUrl = /^https:\/\//i.test(item.owner?.avatar_url || '') ? item.owner.avatar_url : '';
          return `<button class="repo-search-result" type="button" role="option" data-result-index="${index}">
            <span class="repo-search-result-top">
              ${avatarUrl ? `<img class="repo-avatar" src="${escapeHTML(avatarUrl)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : '<span class="repo-avatar placeholder" aria-hidden="true"></span>'}
              <span class="repo-search-name">${escapeHTML(item.full_name || `${item.owner?.login || ''}/${item.name || ''}`)}</span>
            </span>
            <span class="repo-search-meta"><span>★ ${Number(item.stargazers_count || 0).toLocaleString()}</span><span>${escapeHTML(language)}</span><span>Updated ${escapeHTML(formatRelativeDate(item.updated_at))}</span></span>
            <span class="repo-search-description">${escapeHTML(description)}</span>
          </button>`;
        }).join('');
      }
      panel.hidden = false;
      $('repoSearchInput').setAttribute('aria-expanded', 'true');
    };

    const formatRelativeDate = (isoDate) => {
      if (!isoDate) return '—';
      const delta = Math.max(0, Date.now() - new Date(isoDate).getTime());
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;
      if (delta < hour) return `${Math.max(1, Math.floor(delta / minute))}m ago`;
      if (delta < day) return `${Math.floor(delta / hour)}h ago`;
      if (delta < 30 * day) return `${Math.floor(delta / day)}d ago`;
      return new Date(isoDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    };

    const setRepoSearchActive = (index) => {
      const buttons = Array.from(document.querySelectorAll('.repo-search-result'));
      if (!buttons.length) return;
      state.repoSearchActiveIndex = Math.max(0, Math.min(index, buttons.length - 1));
      buttons.forEach((button, buttonIndex) => button.classList.toggle('active', buttonIndex === state.repoSearchActiveIndex));
      buttons[state.repoSearchActiveIndex].scrollIntoView({ block: 'nearest' });
    };

    const chooseRepoSearchResult = (index) => {
      const item = state.repoSearchResults[index];
      if (!item?.full_name) return;
      closeRepoSearch();
      navigateToRepo(item.full_name);
    };

    const searchGitHubRepositories = async (query) => {
      state.repoSearchRequest?.abort();
      const controller = new AbortController();
      state.repoSearchRequest = controller;
      const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&per_page=8`;
      try {
        renderRepoSearchResults([], 'Searching GitHub…');
        const response = await fetch(url, { headers: ghHeaders(), signal: controller.signal });
        updateRateBadge(response);
        if (!response.ok) {
          if (response.status === 403 || response.status === 429) {
            const error = new Error('GitHub search rate limit reached. Add a GitHub token for higher authenticated limits.');
            error.status = response.status;
            throw error;
          }
          if (response.status === 422) throw new Error('GitHub rejected this search query. Try a shorter search phrase.');
          throw new Error(`GitHub search error: ${response.status}`);
        }
        const data = await response.json();
        if (controller.signal.aborted) return;
        renderRepoSearchResults(data.items || [], data.incomplete_results ? 'Showing the results GitHub found before timing out.' : '');
      } catch (error) {
        if (controller.signal.aborted || error.name === 'AbortError') return;
        renderRepoSearchResults([], error.message || 'GitHub search failed.');
      }
    };

    const parseRepoInput = (value) => {
      const input = value.trim();
      const match = input.match(/^(?:https?:\/\/github\.com\/)?([^/\s]+)\/([^/\s?#]+)\/?$/i);
      if (!match) return null;
      const owner = match[1].trim();
      const repo = match[2].trim().replace(/\.git$/i, '');
      if (!owner || !repo) return null;
      return { owner, repo };
    };

    const navigateToRepo = (value) => {
      const parsed = parseRepoInput(value);
      const input = $('repoSearchInput');
      input.classList.toggle('is-invalid', !parsed);
      if (!parsed) return false;
      CONFIG.owner = parsed.owner;
      CONFIG.repo = parsed.repo;
      CONFIG.branch = '';
      branchList = null;
      state.currentFilePath = '';
      state.tree = null;
      state.rootNode = null;
      state.treeFullyLoaded = false;
      clearFileMemoryCache();
      navigateToAppRoute(parsed.owner, parsed.repo);
      input.value = '';
      bootRepo();
      return true;
    };

    const syncRepoSearch = () => {
      $('repoSearchInput').value = '';
      $('repoSearchInput').classList.remove('is-invalid');
    };

    const setupControls = () => {
      $('repoSearch').addEventListener('submit', (event) => {
        event.preventDefault();
        const value = $('repoSearchInput').value.trim();
        $('repoSearchInput').classList.remove('is-invalid');
        if (!value) {
          closeRepoSearch();
          return;
        }
        if (parseRepoInput(value)) {
          closeRepoSearch();
          navigateToRepo(value);
          return;
        }
        searchGitHubRepositories(value);
      });
      $('repoSearchInput').addEventListener('input', () => {
        $('repoSearchInput').classList.remove('is-invalid');
        closeRepoSearch();
      });
      $('repoSearchInput').addEventListener('keydown', (event) => {
        const open = !$('repoSearchResults').hidden;
        const count = document.querySelectorAll('.repo-search-result').length;
        if (event.key === 'Escape') {
          closeRepoSearch();
        } else if (open && count && event.key === 'ArrowDown') {
          event.preventDefault();
          setRepoSearchActive(state.repoSearchActiveIndex + 1);
        } else if (open && count && event.key === 'ArrowUp') {
          event.preventDefault();
          setRepoSearchActive(state.repoSearchActiveIndex <= 0 ? count - 1 : state.repoSearchActiveIndex - 1);
        }
      });
      $('repoSearchResults').addEventListener('click', (event) => {
        const button = event.target.closest('[data-result-index]');
        if (button) chooseRepoSearchResult(Number(button.dataset.resultIndex));
      });
      $('btnSidebar').addEventListener('click', toggleSidebar);
      $('btnDark').addEventListener('click', () => applyDarkMode(!document.body.classList.contains('dark-mode')));
      $('btnFontDec').addEventListener('click', () => changeFontSize(-2));
      $('btnFontInc').addEventListener('click', () => changeFontSize(2));
      $('btnAbout').addEventListener('click', () => renderAboutPanel(true));
      $('btnToken').addEventListener('click', () => {
        if (!state.activePanel) state.panelReturnPath = state.currentFilePath;
        renderTokenPanel();
      });
      $('brandButton').addEventListener('click', () => {
        CONFIG.branch = '';
        branchList = null;
        state.currentFilePath = '';
        state.tree = null;
        state.rootNode = null;
        state.treeFullyLoaded = false;
        clearFileMemoryCache();
        navigateToAppRoute(CONFIG.owner, CONFIG.repo);
        bootRepo();
      });
      $('btnTreeTop').addEventListener('click', () => $('tree').scrollTo({ top: 0, behavior: 'smooth' }));
      $('btnExpand').addEventListener('click', () => {
        const details = Array.from(document.querySelectorAll('#tree details.folder-wrap'));
        const expanding = $('btnExpand').getAttribute('aria-label') !== 'Collapse all folders';
        details.forEach((d) => d.open = expanding);
        $('btnExpand').classList.toggle('is-expanded', expanding);
        $('btnExpand').title = expanding ? 'Collapse all folders' : 'Expand all folders';
        $('btnExpand').setAttribute('aria-label', $('btnExpand').title);
      });
      $('treeFilter').addEventListener('input', debounce(runFilter, 100));
      $('treeFilter').addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          $('treeFilter').value = '';
          runFilter();
        }
      });
      $('btnFilterClear').addEventListener('click', () => {
        $('treeFilter').value = '';
        runFilter();
        $('treeFilter').focus();
      });
      $('tree').addEventListener('click', (event) => {
        const row = event.target.closest('[data-action="select-file"]');
        if (row) selectFile(row.dataset.path);
      });
      $('tree').addEventListener('keydown', handleTreeKeydown);
      $('contentBody').addEventListener('click', handleContentAction);
      $('fileActions').addEventListener('click', handleFileAction);
      $('branchControl').addEventListener('keydown', handleBranchKeydown);
      $('btnBranch').addEventListener('click', () => {
        if ($('branchMenu').hidden) openBranchMenu();
        else closeBranchMenu();
      });
      $('branchMenu').addEventListener('click', (event) => {
        const option = event.target.closest('[data-branch]');
        if (option) switchBranch(option.dataset.branch);
      });
      document.addEventListener('click', (event) => {
        if (!event.target.closest('#branchControl')) closeBranchMenu();
        if (!event.target.closest('#repoSearch')) closeRepoSearch();
      });
      document.addEventListener('keydown', handleGlobalKeydown);
      $('content').addEventListener('scroll', () => {
        $('btnBackTop').style.display = $('content').scrollTop > 320 ? 'grid' : 'none';
      });
      $('btnBackTop').addEventListener('click', () => $('content').scrollTo({ top: 0, behavior: 'smooth' }));
      window.addEventListener('hashchange', handleHashChange);
      window.addEventListener('popstate', () => bootRepo());
      window.addEventListener('beforeunload', clearBlobUrls);
    };

    const toggleSidebar = () => {
      const hidden = $('sidebar').classList.toggle('hidden');
      $('btnSidebar').setAttribute('aria-expanded', String(!hidden));
      safeSet(localStorage, storageKey('sidebarHidden'), String(hidden));
    };

    const changeFontSize = (delta) => {
      const current = Number.parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size'), 10) || 16;
      const next = Math.min(36, Math.max(10, current + delta));
      document.documentElement.style.setProperty('--font-size', `${next}px`);
      if (delta !== 0) safeSet(localStorage, storageKey('fontSize'), `${next}px`);
      $('btnFontDec').title = `Decrease font size · currently ${next}px`;
      $('btnFontInc').title = `Increase font size · currently ${next}px`;
    };

    const handleGlobalKeydown = (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'b') {
        event.preventDefault();
        toggleSidebar();
      } else if (event.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
        event.preventDefault();
        $('treeFilter').focus();
        $('treeFilter').select();
      } else if (event.key === '\\' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
        event.preventDefault();
        focusTreeSelection();
      }
    };

    const handleBranchKeydown = (event) => {
      if (event.key === 'Escape') {
        closeBranchMenu();
        $('btnBranch').focus();
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        if ($('branchMenu').hidden) openBranchMenu();
      } else if (!$('branchMenu').hidden && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
        event.preventDefault();
        const options = Array.from(document.querySelectorAll('.branch-option'));
        if (!options.length) return;
        const current = options.indexOf(document.activeElement);
        let next = current;
        if (event.key === 'ArrowDown') next = current < options.length - 1 ? current + 1 : 0;
        if (event.key === 'ArrowUp') next = current > 0 ? current - 1 : options.length - 1;
        if (event.key === 'Home') next = 0;
        if (event.key === 'End') next = options.length - 1;
        options[next].focus();
      }
    };

    const handleHashChange = () => {
      if (!state.rootNode) return;
      const { anchor } = parseHash();
      if (anchor) scrollToAnchor(anchor);
    };

    const handleContentAction = (event) => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (!action) return;
      if (action === 'open-token') renderTokenPanel();
            else if (action === 'self-test') runSelfTest();
      else if (action === 'toggle-token') {
        const input = $('tokenInput');
        input.type = input.type === 'password' ? 'text' : 'password';
        event.target.textContent = input.type === 'password' ? 'Show' : 'Hide';
      } else if (action === 'save-token') {
        safeSet(localStorage, storageKey('githubToken'), $('tokenInput').value.trim());
        clearFileMemoryCache();
        location.reload();
      } else if (action === 'clear-token') {
        safeRemove(localStorage, storageKey('githubToken'));
        clearFileMemoryCache();
        location.reload();
      } else if (action === 'reset-all') {
        resetAllData();
      }
    };

    const handleFileAction = async (event) => {
      const button = event.target.closest('[data-action]');
      if (!button || !state.currentFilePath) return;
      const action = button.dataset.action;
      const ext = extOf(state.currentFilePath);
      if (action === 'github') {
        return;
      } else if (action === 'toggle-view') {
        const raw = getViewPreference(ext) === 'raw';
        const next = raw ? 'rendered' : 'raw';
        setViewPreference(ext, next);
        button.setAttribute('aria-pressed', String(next === 'raw'));
        if (lastRawText !== null) {
          if (next === 'raw') await viewRaw(lastRawText);
          else if (MARKDOWN_EXTS.includes(ext)) await renderMarkdown(lastRawText, state.currentFilePath, requests.content?.signal || new AbortController().signal);
          else if (ext === 'svg') renderSvg(lastRawText, state.currentFilePath.split('/').pop());
          else renderHtml(lastRawText, ext);
        }
      } else if (action === 'copy') {
        try {
          await navigator.clipboard.writeText(lastRawText ?? '');
          const original = button.innerHTML;
          button.innerHTML = '<svg class="ui-icon" aria-hidden="true"><use href="#i-copy"></use></svg><span>Copied</span>';
          setTimeout(() => button.innerHTML = original, 1000);
        } catch (_) { /* clipboard blocked */ }
      } else if (action === 'print') {
        window.print();
      } else if (action === 'open') {
        await openCurrentFile(button.dataset.download === 'true');
      }
    };

    const openCurrentFile = async (download) => {
      const path = state.currentFilePath;
      const ext = extOf(path);
      const signal = new AbortController().signal;
      const local = localUrlFor(path);
      if (!download && local && !getToken() && ['html', 'htm'].includes(ext)) {
        window.open(local, '_blank', 'noopener');
        return;
      }
      if (!download && !getToken() && TAB_VIEWABLE_EXTS.includes(ext) && !['html', 'htm', 'svg'].includes(ext)) {
        window.open(local || rawUrl(path), '_blank', 'noopener');
        return;
      }
      try {
        const url = await createFileUrl(path, signal);
        const anchor = document.createElement('a');
        anchor.href = url;
        if (download) {
          anchor.download = path.split('/').pop();
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
        } else {
          window.open(url, '_blank', 'noopener');
        }
      } catch (error) {
        showError(error.message);
      }
    };

    const runSelfTest = async () => {
      if (!state.tree) {
        setContentHeader('', '', 'Self-test');
        $('contentBody').innerHTML = '<div class="info-card"><h2>Self-test</h2><p>No repository tree loaded.</p></div>';
        return;
      }
      state.activePanel = 'self-test';
      updateTopButtonState();
      setContentHeader('', '', 'Self-test');
      const files = state.tree.filter((item) => item.type === 'blob' && isVisibleTreeItem(item));
      const rows = [];
      const render = (done, pass, fail, skip) => {
        $('contentBody').innerHTML = `<div class="info-card"><h2>Self-test</h2><p>Rendered/checks every visible file without navigating away.</p><p><strong>${done}</strong> / ${files.length} checked · ✓ ${pass} · ✕ ${fail} · ${skip}</p><table class="selftest-table"><thead><tr><th>Status</th><th>File</th><th>Detail</th></tr></thead><tbody>${rows.map((row) => `<tr class="${row.status}"><td>${row.icon}</td><td>${escapeHTML(row.path)}</td><td>${escapeHTML(row.detail)}</td></tr>`).join('')}</tbody></table></div>`;
      };
      let done = 0, pass = 0, fail = 0, skip = 0;
      render(0, 0, 0, 0);
      for (const item of files) {
        let result;
        if ((item.size || 0) > 5 * 1024 * 1024) {
          result = { status: 'skip', icon: '⏭', detail: `${formatFileSize(item.size)} — too large` };
          skip += 1;
        } else {
          try {
            const ext = extOf(item.path);
            if (IMAGE_EXTS.includes(ext) && ext !== 'svg') {
              await resolveMediaUrl(item.path, new AbortController().signal);
            } else if (SHEET_EXTS.includes(ext)) {
              const data = await fetchFileArrayBuffer(item.path, new AbortController().signal);
              await ensureSpreadsheet();
              window.XLSX.read(ext === 'csv' ? new TextDecoder().decode(data) : data, { type: ext === 'csv' ? 'string' : 'array' });
            } else if (AUDIO_EXTS.includes(ext) || VIDEO_EXTS.includes(ext) || ext === 'pdf') {
              const url = await fetchFileBlob(item.path, ext === 'pdf' ? 'application/pdf' : undefined, new AbortController().signal);
              URL.revokeObjectURL(url);
            } else {
              const text = await fetchFileText(item.path, new AbortController().signal);
              if (MARKDOWN_EXTS.includes(ext)) {
                await ensureMarkdown();
                window.DOMPurify.sanitize(window.marked.parse(text));
              } else if (ext === 'svg') {
                await loadScript('dompurify');
                window.DOMPurify.sanitize(text);
              }
            }
            result = { status: 'pass', icon: '✓', detail: 'loaded' };
            pass += 1;
          } catch (error) {
            result = { status: 'fail', icon: '✕', detail: error.message || 'error' };
            fail += 1;
          }
        }
        rows.push({ ...result, path: item.path });
        done += 1;
        if (done % 5 === 0) render(done, pass, fail, skip);
        await sleep(0);
      }
      render(done, pass, fail, skip);
    };

    const handleManualFolderLink = (event) => {
      const folder = event.target.closest('[data-folder]')?.dataset.folder;
      if (!folder) return;
      event.preventDefault();
      const details = document.querySelector(`details[data-folder-path="${CSS.escape(folder)}"]`);
      if (details) {
        details.open = true;
        details.querySelector(':scope > summary')?.scrollIntoView({ block: 'center', behavior: 'auto' });
      }
    };

    const bootRepo = async () => {
      await detectLocalMode();
      const route = await detectRepo();
      if (route?.invalid) {
        renderHomeState('Invalid repository URL. Enter owner/repo in the top search bar, or use a GitHub-style repository URL.');
        return;
      }
      if (!CONFIG.owner || !CONFIG.repo) {
        renderHomeState();
        return;
      }
      const previousRepo = `${state.owner}/${state.repo}`;
      const nextRepo = `${CONFIG.owner}/${CONFIG.repo}`;
      if (previousRepo !== nextRepo) {
        branchList = null;
        state.repoUpdated = '';
        clearFileMemoryCache();
        clearBlobUrls();
      }
      state.owner = CONFIG.owner;
      state.repo = CONFIG.repo;
      state.branch = CONFIG.branch;
      state.currentFilePath = route?.file || state.currentFilePath || '';
      if (route?.fromQuery) canonicalizeQueryRoute(route);
      else if (!route?.owner && location.pathname === '/') navigateToAppRoute(state.owner, state.repo, state.branch, state.currentFilePath, true);
      updateRepoHeader();
      await fetchTree();
      if (route?.file) {
        const { anchor } = parseHash();
        selectFile(route.file, anchor, 'replace');
      } else autoSelectReadme(Boolean(route?.fromQuery));
    };

    const init = async () => {
      setupAppearance();
      setupResizer();
      const hidden = safeGet(localStorage, storageKey('sidebarHidden')) === 'true';
      if (hidden) {
        $('sidebar').classList.add('hidden');
        $('btnSidebar').setAttribute('aria-expanded', 'false');
      }
      changeFontSize(0);
      setupControls();
      $('contentBody').addEventListener('click', handleManualFolderLink);
      await bootRepo();
    };

    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      $('btnInstall').hidden = false;
    });
    $('btnInstall').addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      $('btnInstall').hidden = true;
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      $('btnInstall').hidden = true;
    });

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch((error) => {
          console.warn('LiteGH service worker registration failed:', error);
        });
      });
    }

    window.addEventListener('error', (event) => console.error('LiteGH error:', event.message));
    window.addEventListener('unhandledrejection', (event) => console.error('LiteGH unhandled rejection:', event.reason));

    document.addEventListener('DOMContentLoaded', init, { once: true });
  </script>
</body>
</html>
