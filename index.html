        </div>
        <div class="filter-wrap">
          <div class="filter-box">
            <label class="sr-only" for="treeFilter">Filter files by name</label>
            <input id="treeFilter" type="search" placeholder="Filter files…" autocomplete="off" spellcheck="false">
            <button id="btnFilterClear" class="filter-clear" type="button" aria-label="Clear filter" title="Clear filter">×</button>
          </div>
        </div>
        <div id="tree" class="tree" tabindex="0"></div>
        <div class="sidebar-foot">
          <button id="btnTreeTop" class="mini-btn" type="button" title="Scroll file list to top">↑ Top</button>
        </div>
      </aside>
      <div id="resizer" class="resizer" title="Drag to resize sidebar"></div>

      <section id="content" class="content" aria-live="polite">
        <div class="content-inner">
          <div id="contentHead" class="content-head">
            <div id="breadcrumbs" class="breadcrumbs"><span class="crumb-file"></span></div>
            <div id="fileActions" class="file-actions"></div>
          </div>
          <div id="contentBody" class="content-body">
            <div id="homeState" class="empty-state" hidden>
              <h1>Welcome to LiteGH!</h1>
              <p>LiteGH is a lightweight Github repository browser. Open a repo from the search bar, go to <code>https://litegh.com/{user}/{repo}</code>, or browse the <a href="/LiteGH/LiteGH">LiteGH repository</a>.</p>
            </div>
          </div>
          <footer class="app-footer">
            <span id="footerText">LiteGH · browser-only GitHub repository viewer</span>
            <span class="footer-links">
              <a href="https://github.com/LiteGH/LiteGH" target="_blank" rel="noopener noreferrer">Source</a>
              <a id="licenseLink" href="#" target="_blank" rel="noopener noreferrer" hidden>License</a>
            </span>
          </footer>
        </div>
        <button id="btnBackTop" class="back-top" type="button" aria-label="Back to top" title="Back to top">↑</button>
      </section>
    </main>
  </div>

  <script>
    /* LiteGH — single-file vanilla GitHub repo browser.
       The UI is intentionally minimal; the underlying workflow mirrors TooToo. */

    const CONFIG = {
      owner: '',
      repo: '',
      branch: '',
      appName: '',
      subtitle: '',
      storagePrefix: 'litegh',
      sourceRepoUrl: 'https://github.com/LiteGH/LiteGH',
      autoOpenFolderReadme: true,
      hiddenFolders: [],
      hiddenFiles: [],
    };

    const state = {
      owner: '',
      repo: '',
      branch: '',
      defaultBranch: '',
      repoUpdated: '',
      tree: null,
      rootNode: null,
      treeVersion: 0,
      treeIndex: new Map(),
      treeFullyLoaded: false,
      currentFilePath: '',
      localMode: false,
      localRepo: { owner: '', repo: '', branch: '' },
      fileAccessBlocked: false,
      activePanel: null,
      panelReturnPath: '',
      repoSearchRequest: null,
      repoSearchResults: [],
      repoSearchActiveIndex: -1,
      markdownImageObserver: null,
    };

    const THIRD_PARTY = {
      marked: {
        src: 'https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js',
        global: 'marked',
      },
      highlight: {
        src: 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js',
        global: 'hljs',
      },
      dompurify: {
        src: 'https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js',
        global: 'DOMPurify',
      },
      xlsx: {
        src: 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js',
        global: 'XLSX',
      },
    };

    const HIGHLIGHT_THEME_URLS = {
      light: 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css',
      dark: 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css',
    };

    const libraryPromises = new Map();
    const stylesheetPromises = new Map();

    const loadScript = (key) => {
      const dependency = THIRD_PARTY[key];
      if (!dependency) return Promise.reject(new Error(`Unknown library: ${key}`));
      if (window[dependency.global]) return Promise.resolve(window[dependency.global]);
      if (libraryPromises.has(key)) return libraryPromises.get(key);

      const promise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = dependency.src;
        script.async = true;
        script.crossOrigin = 'anonymous';
        script.dataset.liteghDependency = key;
        script.onload = () => {
          const library = window[dependency.global];
          if (library) resolve(library);
          else reject(new Error(`Loaded ${key}, but its global is unavailable.`));
        };
        script.onerror = () => reject(new Error(`Unable to load ${key}.`));
        document.head.appendChild(script);
      });

      libraryPromises.set(key, promise);
      promise.catch(() => libraryPromises.delete(key));
      return promise;
    };

    const loadStylesheet = (key, href) => {
      if (stylesheetPromises.has(key)) return stylesheetPromises.get(key);
      const existing = document.querySelector(`link[data-litegh-style="${CSS.escape(key)}"]`);
      if (existing) return Promise.resolve(existing);

      const promise = new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.dataset.liteghStyle = key;
        link.onload = () => resolve(link);
        link.onerror = () => reject(new Error(`Unable to load ${key} stylesheet.`));
        document.head.appendChild(link);
      });

      stylesheetPromises.set(key, promise);
      promise.catch(() => stylesheetPromises.delete(key));
      return promise;
    };

    const ensureMarkdown = () => Promise.all([
      loadScript('marked'),
      loadScript('dompurify'),
    ]);

    const ensureHighlight = async () => {
      await loadScript('highlight');
      const dark = document.body.classList.contains('dark-mode');
      await loadStylesheet(dark ? 'hljs-dark' : 'hljs-light', HIGHLIGHT_THEME_URLS[dark ? 'dark' : 'light']);
      updateHighlightThemeLinks();
      return window.hljs;
    };

    const ensureSpreadsheet = () => Promise.all([
      loadScript('xlsx'),
      loadScript('dompurify'),
    ]);

    const updateHighlightThemeLinks = () => {
      const light = document.querySelector('link[data-litegh-style="hljs-light"]');
      const dark = document.querySelector('link[data-litegh-style="hljs-dark"]');
      if (!light && !dark) return;
      const enabledDark = document.body.classList.contains('dark-mode');
      if (light) light.media = enabledDark ? 'not all' : 'all';
      if (dark) dark.media = enabledDark ? 'all' : 'not all';
    };

    const cache = new Map();
    let memoryCacheBytes = 0;
    const MEMORY_FILE_CACHE_MAX_BYTES = 5 * 1024 * 1024;
    const MEMORY_FILE_CACHE_ITEM_MAX_BYTES = 1024 * 1024;
    const SESSION_FILE_CACHE_MAX_BYTES = 1024 * 1024;
    const SESSION_FILE_CACHE_ITEM_MAX_BYTES = 256 * 1024;
    const fileCachePrefix = () => storageKey('fileText');
    const fileCacheIndexKey = () => storageKey('fileTextIndex');

    const getMemoryFileCache = (key) => {
      const value = cache.get(key);
      if (value == null) return null;
      cache.delete(key);
      cache.set(key, value);
      return value;
    };
    const setMemoryFileCache = (key, text) => {
      if (cache.has(key)) {
        memoryCacheBytes -= cache.get(key).length;
        cache.delete(key);
      }
      if (text.length > MEMORY_FILE_CACHE_ITEM_MAX_BYTES) return;
      cache.set(key, text);
      memoryCacheBytes += text.length;
      while (memoryCacheBytes > MEMORY_FILE_CACHE_MAX_BYTES && cache.size) {
        const oldestKey = cache.keys().next().value;
        const oldestText = cache.get(oldestKey);
        cache.delete(oldestKey);
        memoryCacheBytes -= oldestText.length;
      }
    };
    const clearFileMemoryCache = () => {
      cache.clear();
      memoryCacheBytes = 0;
    };
    const sessionFileKey = (key) => `${fileCachePrefix()}:${encodeURIComponent(key)}`;

    const readSessionFileCache = (key) => {
      try {
        const raw = sessionStorage.getItem(sessionFileKey(key));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return typeof parsed?.text === 'string' ? parsed.text : null;
      } catch (_) {
        return null;
      }
    };

    const writeSessionFileCache = (key, text) => {
      if (text.length > SESSION_FILE_CACHE_ITEM_MAX_BYTES) return;

      const itemKey = sessionFileKey(key);
      try {
        sessionStorage.setItem(itemKey, JSON.stringify({ text, used: Date.now() }));

        let index = [];
        try {
          index = JSON.parse(sessionStorage.getItem(fileCacheIndexKey()) || '[]');
          if (!Array.isArray(index)) index = [];
        } catch (_) {
          index = [];
        }

        index = index.filter((item) => item?.key !== itemKey);
        index.push({ key: itemKey, bytes: text.length, used: Date.now() });

        let total = index.reduce((sum, item) => sum + (Number(item.bytes) || 0), 0);
        index.sort((a, b) => (a.used || 0) - (b.used || 0));

        while (total > SESSION_FILE_CACHE_MAX_BYTES && index.length > 1) {
          const oldest = index.shift();
          total -= Number(oldest.bytes) || 0;
          try { sessionStorage.removeItem(oldest.key); } catch (_) {}
        }

        try {
          sessionStorage.setItem(fileCacheIndexKey(), JSON.stringify(index));
        } catch (_) {}
      } catch (_) {
        try { sessionStorage.removeItem(itemKey); } catch (_) {}
      }
    };

    const blobUrls = new Set();
    const requests = { tree: null, content: null };
    let branchList = null;
    let hashNavigated = false;
    let lastRawText = null;
    let treeRows = [];

    const MARKDOWN_EXTS = ['md', 'markdown', 'mkd', 'mdown', 'mkdn'];
    const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'ico'];
    const AUDIO_EXTS = ['mp3', 'wav', 'ogg'];
    const VIDEO_EXTS = ['mp4', 'webm'];
    const SHEET_EXTS = ['xlsx', 'xls', 'csv', 'ods'];
    const TAB_VIEWABLE_EXTS = [
      'html', 'htm', 'pdf', 'txt', 'text', ...MARKDOWN_EXTS,
      ...IMAGE_EXTS, ...AUDIO_EXTS, ...VIDEO_EXTS,
      'js', 'mjs', 'cjs', 'jsx', 'ts', 'tsx', 'json', 'css', 'scss', 'less',
      'xml', 'yaml', 'yml', 'toml', 'ini', 'cfg', 'conf', 'env',
      'py', 'rb', 'go', 'rs', 'java', 'kt', 'c', 'h', 'cpp', 'cc', 'hpp',
      'cs', 'php', 'sh', 'bash', 'zsh', 'sql', 'pl', 'lua', 'r', 'swift', 'log',
    ];
    const NO_COPY_EXTS = [...IMAGE_EXTS, ...AUDIO_EXTS, ...VIDEO_EXTS, 'pdf', ...SHEET_EXTS];
    const README_RE = /^readme(?:\.(?:md|markdown|mkd|mdown|txt))?$/i;
    const MAX_MARKDOWN_BYTES = 5 * 1024 * 1024;
    const MAX_SPREADSHEET_BYTES = 10 * 1024 * 1024;
    const MAX_HTML_PREVIEW_BYTES = 5 * 1024 * 1024;

    const $ = (id) => document.getElementById(id);
    const escapeHTML = (value) => String(value).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
    const displayName = (name) => name.replace(/-/g, ' ');
    const extOf = (path) => {
      const name = path.split('/').pop() || '';
      return name.includes('.') ? name.split('.').pop().toLowerCase() : '';
    };
    const encodePath = (path) => path.split('/').map(encodeURIComponent).join('/');
    const encodeHash = (path) => encodePath(path);
    const formatFileSize = (bytes = 0) => {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / 1024 ** i).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    };
    const debounce = (fn, ms) => {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    };
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    const storageKey = (suffix) => `${CONFIG.storagePrefix}:${location.pathname}:${suffix}`;
    const safeGet = (store, key) => {
      try { return store.getItem(key); } catch (_) { return null; }
    };
    const safeSet = (store, key, value) => {
      try { store.setItem(key, value); } catch (_) { /* storage blocked */ }
    };
    const safeRemove = (store, key) => {
      try { store.removeItem(key); } catch (_) { /* storage blocked */ }
    };

    const getToken = () => safeGet(localStorage, storageKey('githubToken')) || '';
    const clearBlobUrls = () => {
      for (const url of blobUrls) URL.revokeObjectURL(url);
      blobUrls.clear();
    };
    const makeBlobUrl = (blob) => {
      const url = URL.createObjectURL(blob);
      blobUrls.add(url);
      return url;
    };

    const updateRateBadge = (response) => {
      const remaining = response?.headers?.get('X-RateLimit-Remaining');
      const limit = response?.headers?.get('X-RateLimit-Limit');
      if (remaining == null || limit == null) return;
      const value = Number.parseInt(remaining, 10);
      const badge = $('rateBadge');
      badge.textContent = `${remaining}/${limit}`;
      badge.title = `${remaining}/${limit} GitHub API requests left this hour`;
      badge.classList.toggle('low', value > 10 && value <= 30);
      badge.classList.toggle('critical', value <= 10);
      badge.style.display = value <= 30 ? 'inline-flex' : 'none';
    };

    const ghHeaders = (raw = false) => {
      const headers = raw ? { Accept: 'application/vnd.github.raw+json' } : { Accept: 'application/vnd.github+json' };
      const token = getToken();
      if (token) headers.Authorization = `Bearer ${token}`;
      return headers;
    };

    const ghApi = async (url, signal) => {
      const response = await fetch(url, { headers: ghHeaders(), signal });
      updateRateBadge(response);
      if (response.status === 403 || response.status === 429) {
        const error = new Error('GitHub rate limit reached. Add a GitHub token for higher limits.');
        error.status = response.status;
        throw error;
      }
      if (response.status === 404) {
        const error = new Error('Repository or branch not found. For private repositories, add a GitHub token with Contents: Read access.');
        error.status = 404;
        throw error;
      }
      if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);
      return response.json();
    };

    const rawUrl = (path) =>
      `https://raw.githubusercontent.com/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}/${encodeURIComponent(state.branch)}/${encodePath(path)}`;
    const jsDelivrDataUrl = () =>
      `https://data.jsdelivr.com/v1/packages/gh/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}@${encodeURIComponent(state.branch)}?structure=tree`;
    const contentsApiUrl = (path) => {
      const suffix = path ? `/${encodePath(path)}` : '';
      return `https://api.github.com/repos/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}/contents${suffix}?ref=${encodeURIComponent(state.branch)}`;
    };

    const localUrlFor = (path) => {
      if (!state.localMode || !state.localRepo.owner || !state.localRepo.repo || !state.localRepo.branch) return null;
      if (state.owner.toLowerCase() !== state.localRepo.owner.toLowerCase() || state.repo.toLowerCase() !== state.localRepo.repo.toLowerCase()) return null;
      if (state.branch !== state.localRepo.branch) return null;
      return `./${encodePath(path)}`;
    };

    const fetchFileResponse = async (path, signal) => {
      const localUrl = localUrlFor(path);
      if (localUrl) {
        try {
          const response = await fetch(localUrl, { signal });
          if (response.ok) return response;
        } catch (error) {
          if (error.name === 'AbortError') throw error;
        }
      }

      const response = getToken()
        ? await fetch(contentsApiUrl(path), { headers: ghHeaders(true), signal })
        : await fetch(rawUrl(path), { signal });
      updateRateBadge(response);
      if (!response.ok) throw new Error(`Failed to load ${path}: ${response.status}`);
      return response;
    };

    const fetchFileText = async (path, signal) => {
      const key = `${state.owner}/${state.repo}/${state.branch}/${path}`;
      const memoryCached = getMemoryFileCache(key);
      if (memoryCached !== null) return memoryCached;
      const stored = readSessionFileCache(key);
      if (stored !== null) {
        setMemoryFileCache(key, stored);
        return stored;
      }
      const response = await fetchFileResponse(path, signal);
      const text = await response.text();
      setMemoryFileCache(key, text);
      writeSessionFileCache(key, text);
      return text;
    };

    const fetchFileBlob = async (path, mime, signal) => {
      let blob = await (await fetchFileResponse(path, signal)).blob();
      if (mime) blob = new Blob([blob], { type: mime });
      return makeBlobUrl(blob);
    };

    const fetchFileArrayBuffer = async (path, signal) =>
      new Uint8Array(await (await fetchFileResponse(path, signal)).arrayBuffer());

    const HIDDEN_FOLDERS = new Set((CONFIG.hiddenFolders || []).map((value) => value.toLowerCase()));
    const HIDDEN_FILES = new Set((CONFIG.hiddenFiles || []).map((value) => value.toLowerCase()));

    const isVisibleTreeItem = (item) => {
      const parts = item.path.split('/');
      if (parts.some((part) => part.startsWith('.') || HIDDEN_FOLDERS.has(part.toLowerCase()))) return false;
      if (item.type !== 'blob') return true;
      const lowerName = parts[parts.length - 1].toLowerCase();
      return !HIDDEN_FILES.has(lowerName) && !HIDDEN_FILES.has(`/${item.path.toLowerCase()}`);
    };

    const FILE_ICON_MAP = {
        js: ['i-js', 'kind-js'], mjs: ['i-js', 'kind-js'], cjs: ['i-js', 'kind-js'],
        jsx: ['i-js', 'kind-js'], ts: ['i-code', 'kind-ts'], tsx: ['i-code', 'kind-ts'],
        json: ['i-json', 'kind-json'], json5: ['i-json', 'kind-json'],
        html: ['i-html', 'kind-html'], htm: ['i-html', 'kind-html'], xhtml: ['i-html', 'kind-html'],
        css: ['i-css', 'kind-css'], scss: ['i-css', 'kind-css'], less: ['i-css', 'kind-css'],
        md: ['i-markdown', 'kind-markdown'], markdown: ['i-markdown', 'kind-markdown'], mkd: ['i-markdown', 'kind-markdown'],
        py: ['i-python', 'kind-python'], pyw: ['i-python', 'kind-python'],
        sh: ['i-terminal', 'kind-shell'], bash: ['i-terminal', 'kind-shell'], zsh: ['i-terminal', 'kind-shell'],
        png: ['i-image', 'kind-image'], jpg: ['i-image', 'kind-image'], jpeg: ['i-image', 'kind-image'], gif: ['i-image', 'kind-image'], webp: ['i-image', 'kind-image'], svg: ['i-image', 'kind-image'], ico: ['i-image', 'kind-image'],
        mp3: ['i-audio', 'kind-audio'], wav: ['i-audio', 'kind-audio'], ogg: ['i-audio', 'kind-audio'], flac: ['i-audio', 'kind-audio'], m4a: ['i-audio', 'kind-audio'],
        mp4: ['i-video', 'kind-video'], webm: ['i-video', 'kind-video'], mov: ['i-video', 'kind-video'], mkv: ['i-video', 'kind-video'],
        pdf: ['i-pdf', 'kind-pdf'],
        xlsx: ['i-sheet', 'kind-sheet'], xls: ['i-sheet', 'kind-sheet'], csv: ['i-sheet', 'kind-sheet'], ods: ['i-sheet', 'kind-sheet'],
        zip: ['i-archive', 'kind-archive'], gz: ['i-archive', 'kind-archive'], tgz: ['i-archive', 'kind-archive'], tar: ['i-archive', 'kind-archive'], rar: ['i-archive', 'kind-archive'], '7z': ['i-archive', 'kind-archive'],
        toml: ['i-data', 'kind-data'], yaml: ['i-data', 'kind-data'], yml: ['i-data', 'kind-data'], xml: ['i-code', 'kind-ts'],
      };

    const getFileIcon = (name) => {
      return FILE_ICON_MAP[extOf(name)] || ['i-file', ''];
    };

    const makeRootNode = () => ({
      type: 'tree',
      path: '',
      children: Object.create(null),
      loaded: false,
      loading: false,
      request: null,
      source: null,
    });

    const normalizeTreeEntry = (item) => ({
      type: ['dir', 'tree'].includes(item.type) ? 'tree' : 'blob',
      path: item.path,
      size: item.size || 0,
      sha: item.sha || '',
      html_url: item.html_url || '',
      download_url: item.download_url || '',
    });

    const rememberTreeEntry = (item) => {
      const existing = state.treeIndex.get(item.path);
      if (existing) {
        Object.assign(existing, item);
      } else {
        state.tree.push(item);
        state.treeIndex.set(item.path, item);
      }
    };

    const directoryNodeFor = (path) => {
      if (!path) return state.rootNode;
      return path.split('/').reduce((node, part) => node?.children?.[part], state.rootNode);
    };

    const mergeTreeEntries = (node, items) => {
      for (const rawItem of items) {
        if (!rawItem?.path || !['blob', 'tree'].includes(rawItem.type)) continue;
        const item = normalizeTreeEntry(rawItem);
        if (!isVisibleTreeItem(item)) continue;
        const relativePath = node.path && item.path.startsWith(`${node.path}/`)
          ? item.path.slice(node.path.length + 1)
          : item.path;
        const fullPath = node.path ? `${node.path}/${relativePath}` : relativePath;
        item.path = fullPath;
        const name = relativePath.split('/').filter(Boolean).pop();
        if (!name) continue;
        if (item.type === 'tree') {
          const child = node.children[name] || {
            type: 'tree',
            path: item.path,
            children: Object.create(null),
            loaded: false,
            loading: false,
            request: null,
            source: item,
          };
          child.path = item.path;
          child.source = item;
          node.children[name] = child;
        } else {
          node.children[name] = item;
        }
        rememberTreeEntry(item);
      }
      node.loaded = true;
    };

    const mergeRecursiveTree = (items, treeSha = '') => {
      state.rootNode = makeRootNode();
      state.rootNode.loaded = true;
      state.rootNode.source = { sha: treeSha };
      state.tree = [];
      state.treeIndex = new Map();
      state.treeFullyLoaded = true;
      for (const rawItem of items) {
        if (!rawItem?.path || !['blob', 'tree'].includes(rawItem.type)) continue;
        const item = normalizeTreeEntry(rawItem);
        if (!isVisibleTreeItem(item)) continue;
        const parts = item.path.split('/').filter(Boolean);
        let node = state.rootNode;
        for (let index = 0; index < parts.length - 1; index += 1) {
          const part = parts[index];
          if (!node.children[part] || node.children[part].type !== 'tree') {
            node.children[part] = {
              type: 'tree',
              path: parts.slice(0, index + 1).join('/'),
              children: Object.create(null),
              loaded: true,
              loading: false,
              request: null,
              source: null,
            };
          }
          node = node.children[part];
        }
        const name = parts[parts.length - 1];
        if (item.type === 'tree') {
          const child = node.children[name] || {
            type: 'tree',
            path: item.path,
            children: Object.create(null),
            loaded: true,
            loading: false,
            request: null,
            source: item,
          };
          child.path = item.path;
          child.source = item;
          node.children[name] = child;
        } else {
          node.children[name] = item;
        }
        rememberTreeEntry(item);
      }
    };

    const treeApiUrl = (treeSha = state.branch, recursive = false) =>
      `https://api.github.com/repos/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}/git/trees/${encodeURIComponent(treeSha)}${recursive ? '?recursive=1' : ''}`;

    const flattenJsDelivrTree = (nodes, parentPath = '') => {
      if (!Array.isArray(nodes)) return [];
      const result = [];
      const stack = [{ nodes, parentPath }];

      while (stack.length) {
        const frame = stack.pop();
        for (let index = frame.nodes.length - 1; index >= 0; index -= 1) {
          const node = frame.nodes[index];
          if (!node || typeof node !== 'object') continue;
          const nodeName = String(node.name ?? '').replace(/^\/+|\/+$/g, '');
          const nodePath = node.path || (frame.parentPath && nodeName ? `${frame.parentPath}/${nodeName}` : nodeName);
          if (!nodePath) continue;

          const children = Array.isArray(node.files)
            ? node.files
            : Array.isArray(node.children)
              ? node.children
              : null;
          const isTree = Boolean(children) || ['directory', 'dir', 'tree'].includes(String(node.type || '').toLowerCase());

          if (isTree) {
            result.push({
              type: 'tree',
              path: nodePath,
              size: 0,
              sha: node.hash || node.sha || '',
              html_url: '',
              download_url: ''
            });
            if (children?.length) stack.push({ nodes: children, parentPath: nodePath });
          } else {
            result.push({
              type: 'blob',
              path: nodePath,
              size: Number(node.size || 0),
              sha: node.hash || node.sha || '',
              html_url: '',
              download_url: rawUrl(nodePath)
            });
          }
        }
      }

      return result;
    };

    const loadTreeFromJsDelivr = async (signal) => {
      const response = await fetch(jsDelivrDataUrl(), { signal });
      if (!response.ok) {
        const error = new Error(`jsDelivr tree request failed: ${response.status}`);
        error.status = response.status;
        throw error;
      }
      const data = await response.json();
      const nodes = Array.isArray(data?.files) ? data.files : Array.isArray(data) ? data : [];
      const items = flattenJsDelivrTree(nodes);
      if (!items.length && nodes.length) throw new Error('jsDelivr returned an empty or unsupported tree format.');
      if (!items.length && !data?.default) throw new Error('jsDelivr returned no repository files.');
      return { data, items };
    };

    const renderTree = () => {
      const root = state.rootNode;
      const html = root
        ? Object.entries(root.children)
          .sort(([a, av], [b, bv]) => compareNodes(a, av, b, bv))
          .map(([name, node]) => renderTreeNode(name, node, '', 0))
          .join('')
        : '';
      $('tree').innerHTML = html || '<div class="notice">No visible files in this repository.</div>';
      treeRows = Array.from(document.querySelectorAll('.tree-item'));
      bindFolderAutoOpen();
      updateFileCount(state.tree || []);
      runFilter();
    };

    const renderFolderChildren = (node, parentPath, depth) => Object.entries(node.children)
      .sort(([a, av], [b, bv]) => compareNodes(a, av, b, bv))
      .map(([childName, childNode]) => renderTreeNode(childName, childNode, parentPath, depth))
      .join('');

    const renderTreeNode = (name, node, parentPath, depth) => {
      const fullPath = parentPath ? `${parentPath}/${name}` : name;
      if (node.type === 'tree') {
        const children = `<div class="folder-placeholder">${state.treeFullyLoaded && node.loaded ? 'Open folder to show files…' : 'Open folder to load files…'}</div>`;
        const hasReadme = node.loaded && Object.keys(node.children).some((childName) => node.children[childName].type === 'blob' && README_RE.test(childName));
        const summaryClass = `tree-folder tree-indent-${Math.min(depth, 4)}`;
        return `<details class="folder-wrap" data-folder-path="${escapeHTML(fullPath)}" ${hasReadme ? 'data-readme="1"' : ''}>
          <summary class="${summaryClass}" title="${escapeHTML(fullPath)}">
            <svg class="ui-icon tree-folder-icon" aria-hidden="true"><use href="#i-folder"></use></svg><span class="tree-name">${escapeHTML(displayName(name))}</span>
          </summary>
          <div class="folder-children">${children}</div>
        </details>`;
      }

      const size = formatFileSize(node.size || 0);
      const readme = README_RE.test(name) ? '<strong>' + escapeHTML(displayName(name)) + '</strong>' : escapeHTML(displayName(name));
      const [fileIcon, fileKind] = getFileIcon(name);
      const className = `tree-item tree-indent-${Math.min(depth, 4)}`;
      return `<div class="${className}" role="button" tabindex="0" data-action="select-file" data-path="${escapeHTML(fullPath)}" title="${escapeHTML(fullPath)}\n${escapeHTML(size)}">
        <span class="tree-item-main"><svg class="ui-icon tree-icon file-kind ${fileKind}" aria-hidden="true"><use href="#${fileIcon}"></use></svg><span class="tree-name">${readme}</span></span>
        <span class="tree-size">${escapeHTML(size)}</span>
      </div>`;
    };

    const updateFileCount = (items) => {
      const visible = items.filter(isVisibleTreeItem);
      const files = visible.filter((item) => item.type === 'blob').length;
      $('fileCount').textContent = `${files} file${files === 1 ? '' : 's'}`;
      $('fileCount').title = state.treeFullyLoaded ? 'Tree fully loaded' : 'Tree partially loaded';
    };

    const loadDirectoryNode = async (node, externalSignal = null) => {
      if (!node || node.type !== 'tree') return true;
      if (node.loaded) {
        const details = document.querySelector(`details[data-folder-path="${CSS.escape(node.path)}"]`);
        if (details?.open) {
          const holder = details.querySelector(':scope > .folder-children');
          if (holder) holder.innerHTML = renderFolderChildren(node, node.path, node.path ? node.path.split('/').length : 0);
          treeRows = Array.from(document.querySelectorAll('.tree-item'));
          bindFolderAutoOpen();
          updateFileCount(state.tree || []);
          runFilter();
        }
        return true;
      }
      if (node.loading && node.request) {
        await node.request.promise;
        return node.loaded;
      }

      const version = state.treeVersion;
      const controller = new AbortController();
      node.request = controller;
      if (externalSignal) {
        const abort = () => controller.abort();
        if (externalSignal.aborted) controller.abort();
        else externalSignal.addEventListener('abort', abort, { once: true });
      }
      node.loading = true;

      const details = document.querySelector(`details[data-folder-path="${CSS.escape(node.path)}"]`);
      if (details) {
        const holder = details.querySelector(':scope > .folder-children');
        if (holder) holder.innerHTML = '<div class="folder-placeholder">Loading files…</div>';
      }

      const promise = (async () => {
        try {
          const treeSha = node.source?.sha;
          if (!treeSha) throw new Error(`GitHub did not provide a tree identifier for ${node.path || 'repository root'}.`);
          const data = await ghApi(treeApiUrl(treeSha, false), controller.signal);
          if (version !== state.treeVersion) return false;
          if (!data || !Array.isArray(data.tree)) throw new Error(`GitHub returned an unexpected tree response for ${node.path || 'repository root'}.`);
          if (data.truncated) throw new Error(`GitHub returned too many entries for ${node.path || 'repository root'}.`);
          mergeTreeEntries(node, data.tree);
          return true;
        } catch (error) {
          if (controller.signal.aborted || version !== state.treeVersion) return false;
          node.loadError = error;
          const holder = document.querySelector(`details[data-folder-path="${CSS.escape(node.path)}"] :scope > .folder-children`);
          if (holder) holder.innerHTML = `<div class="folder-placeholder error">${escapeHTML(error.message)}</div>`;
          return false;
        } finally {
          node.loading = false;
          node.request = null;
        }
      })();

      controller.promise = promise;
      await promise;
      if (version !== state.treeVersion) return false;

      const detailsAfter = document.querySelector(`details[data-folder-path="${CSS.escape(node.path)}"]`);
      if (detailsAfter && node.loaded) {
        const holder = detailsAfter.querySelector(':scope > .folder-children');
        if (holder) holder.innerHTML = renderFolderChildren(node, node.path, node.path ? node.path.split('/').length : 0);
        if (node.loaded) {
          const hasReadme = Object.keys(node.children).some((childName) => node.children[childName].type === 'blob' && README_RE.test(childName));
          detailsAfter.dataset.readme = hasReadme ? '1' : '';
        }
      } else if (node.path === '') {
        renderTree();
      }
      treeRows = Array.from(document.querySelectorAll('.tree-item'));
      bindFolderAutoOpen();
      updateFileCount(state.tree || []);
      runFilter();
      return node.loaded;
    };

    const ensureRepoPath = async (path) => {
      if (!state.rootNode || !path) return null;
      let node = state.rootNode;
      const parts = path.split('/').filter(Boolean);
      for (let index = 0; index < parts.length; index += 1) {
        if (!node.loaded && !(await loadDirectoryNode(node))) return null;
        const child = node.children[parts[index]];
        if (!child) return null;
        node = child;
        if (index < parts.length - 1 && node.type !== 'tree') return null;
      }
      return node.type === 'blob' ? node : null;
    };

    const compareNodes = (aName, aNode, bName, bNode) => {
      const aFolder = aNode.type === 'tree';
      const bFolder = bNode.type === 'tree';
      if (aFolder !== bFolder) return aFolder ? -1 : 1;
      return aName.toLowerCase().localeCompare(bName.toLowerCase());
    };

    const runFilter = () => {
      const query = $('treeFilter').value.trim().toLowerCase();
      $('btnFilterClear').style.display = query ? 'block' : 'none';
      $('treeFilter').title = !state.treeFullyLoaded && query
        ? 'This repository has a large tree; search includes files loaded from opened folders.'
        : 'Filter loaded files and folders';
      const folders = Array.from(document.querySelectorAll('.folder-wrap'));
      const files = Array.from(document.querySelectorAll('.tree-item'));
      if (!query) {
        files.forEach((row) => row.classList.remove('is-hidden'));
        folders.forEach((folder) => {
          folder.classList.remove('is-hidden');
        });
        return;
      }

      files.forEach((row) => {
        const path = (row.dataset.path || '').toLowerCase();
        row.classList.toggle('is-hidden', !path.includes(query));
      });

      folders.forEach((folder) => {
        const hasVisibleFile = !!folder.querySelector('.tree-item:not(.is-hidden)');
        const folderMatch = (folder.dataset.folderPath || '').toLowerCase().includes(query);
        folder.classList.toggle('is-hidden', !(hasVisibleFile || folderMatch));
        if (!folder.classList.contains('is-hidden')) folder.open = true;
      });
    };

    const bindFolderAutoOpen = () => {
      document.querySelectorAll('.folder-wrap').forEach((details) => {
        if (details.dataset.bound === '1') return;
        details.dataset.bound = '1';
        details.addEventListener('toggle', async () => {
          if (!details.open) return;
          const node = directoryNodeFor(details.dataset.folderPath || '');
          if (!node) return;
          const loaded = await loadDirectoryNode(node);
          if (!loaded || !CONFIG.autoOpenFolderReadme) return;
          if (node.path && details.dataset.autoOpened !== '1') {
            details.dataset.autoOpened = '1';
            const readme = Object.entries(node.children).find(([childName, childNode]) => childNode.type === 'blob' && README_RE.test(childName));
            if (readme) setTimeout(() => selectFile(readme[1].path), 0);
          }
        });
      });
    };

    const updateActiveRow = (path) => {
      let active = null;
      treeRows.forEach((row) => {
        const isActive = row.dataset.path === path;
        row.classList.toggle('active', isActive);
        if (isActive) active = row;
      });
      if (active) {
        let parent = active.closest('details');
        while (parent) {
          parent.open = true;
          parent = parent.parentElement?.closest('details');
        }
        active.scrollIntoView({ block: 'center', behavior: 'auto' });
      }
    };

    const buildAppRoute = (owner, repo, branch = '', file = '') => {
      let route = `?${owner}/${repo}`;
      if (branch) {
        route += file
          ? `/blob/${encodeURIComponent(branch)}/${encodePath(file)}`
          : `/tree/${encodeURIComponent(branch)}`;
      }
      return route;
    };

    const parseRouteString = (value) => {
      const raw = value.replace(/^\?/, '').replace(/^\//, '').replace(/\/$/, '');
      if (!raw) return null;
      const match = raw.match(/^([^/]+)\/([^/]+)(?:\/(tree|blob)\/(.*))?$/);
      if (!match) return null;
      const owner = safeDecode(match[1]);
      const repo = safeDecode(match[2]);
      const mode = match[3] || '';
      const tailRaw = match[4] || '';
      if (!owner || !repo) return null;
      if (mode === 'tree') return { owner, repo, branch: safeDecode(tailRaw), file: '' };
      if (mode === 'blob') {
        const slash = tailRaw.indexOf('/');
        if (slash < 0) return { owner, repo, branch: safeDecode(tailRaw), file: '' };
        return { owner, repo, branch: safeDecode(tailRaw.slice(0, slash)), file: safeDecode(tailRaw.slice(slash + 1)) };
      }
      return { owner, repo, branch: '', file: '' };
    };

    const parseAppRoute = () => parseRouteString(location.search);

    const buildPublicRoute = (owner, repo, branch = '', file = '') =>
      location.protocol === 'file:'
        ? buildAppRoute(owner, repo, branch, file)
        : buildCleanPathRoute(owner, repo, branch, file);

    const navigateToAppRoute = (owner, repo, branch = '', file = '', replace = false, anchor = '') => {
      const route = buildPublicRoute(owner, repo, branch, file);
      const hash = anchor ? `#${encodeHash(anchor)}` : '';
      const url = route.startsWith('?') ? `${location.pathname}${route}${hash}` : `${route}${hash}`;
      if (replace) history.replaceState(null, '', url);
      else history.pushState({}, '', url);
      hashNavigated = Boolean(hash);
    };

    const buildCleanPathRoute = (owner, repo, branch = '', file = '') => {
      let route = `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
      if (branch) {
        route += file
          ? `/blob/${encodeURIComponent(branch)}/${encodePath(file)}`
          : `/tree/${encodeURIComponent(branch)}`;
      }
      return route;
    };

    const canonicalizeQueryRoute = (route) => {
      if (!route || !location.search) return;
      const cleanUrl = `${buildCleanPathRoute(route.owner, route.repo, route.branch, route.file)}${location.hash || ''}`;
      window.history.replaceState(null, '', cleanUrl);
    };

    const parseHash = () => ({
      anchor: safeDecode(location.hash.replace(/^#/, ''))
    });
    const safeDecode = (value) => {
      try { return decodeURIComponent(value); } catch (_) { return value; }
    };
    const updateHash = (anchor = '') => {
      const target = anchor ? `#${encodeHash(anchor)}` : '';
      try {
        if (hashNavigated) {
          if (location.hash !== target) location.hash = target;
        } else {
          history.replaceState(null, '', `${location.pathname}${location.search}${target}`);
        }
      } catch (_) { /* noop */ }
      hashNavigated = Boolean(target);
    };

    const resolveRepoPath = (href, currentDir) => {
      const clean = href.split(/[?#]/, 1)[0];
      const stack = !clean.startsWith('/') && currentDir ? currentDir.split('/').filter(Boolean) : [];
      for (const part of clean.split('/')) {
        if (!part || part === '.') continue;
        if (part === '..') stack.pop();
        else stack.push(safeDecode(part));
      }
      return stack.join('/');
    };

    const slugify = (text) => {
      const slug = text.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
      return slug || 'section';
    };

    const renderMarkdown = async (text, path, signal, anchor = '') => {
      if (text.length > MAX_MARKDOWN_BYTES) {
        const notice = document.createElement('div');
        notice.className = 'notice warning';
        notice.textContent = `Markdown preview is limited to ${formatFileSize(MAX_MARKDOWN_BYTES)}. Use Raw to view the complete file.`;
        const wrap = document.createElement('div');
        wrap.className = 'source-block';
        const code = document.createElement('code');
        code.textContent = text;
        const pre = document.createElement('pre');
        pre.appendChild(code);
        wrap.appendChild(pre);
        $('contentBody').replaceChildren(notice, wrap);
        return;
      }
      await ensureMarkdown();
      if (signal.aborted) return;
      const currentDir = path.includes('/') ? path.split('/').slice(0, -1).join('/') : '';
      const html = window.marked.parse(text, { breaks: false, gfm: true });
      const wrapper = document.createElement('div');
      wrapper.className = 'markdown-body';
      wrapper.innerHTML = window.DOMPurify.sanitize(html, { USE_PROFILES: { html: true }, ADD_ATTR: ['target', 'rel'] });

      const used = new Set();
      wrapper.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading) => {
        const base = slugify(heading.textContent || 'section');
        let id = base;
        let index = 2;
        while (used.has(id) || wrapper.querySelectorAll(`[id="${CSS.escape(id)}"]`).length) id = `${base}-${index++}`;
        used.add(id);
        heading.id = id;
      });

      wrapper.querySelectorAll('a[href]').forEach((link) => {
        const href = link.getAttribute('href') || '';
        if (/^(https?:)?\/\//i.test(href) || /^[a-z][a-z0-9+.-]*:/i.test(href)) {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          return;
        }
        const fragmentIndex = href.indexOf('#');
        const clean = fragmentIndex >= 0 ? href.slice(0, fragmentIndex) : href;
        const fragment = fragmentIndex >= 0 ? safeDecode(href.slice(fragmentIndex + 1)) : '';
        const repoPath = clean.startsWith('?') || clean === '' ? path : resolveRepoPath(clean, currentDir);
        link.href = repoPath === path && fragment
          ? `#${encodeHash(fragment)}`
          : `${buildPublicRoute(state.owner, state.repo, state.branch, repoPath)}${fragment ? `#${encodeHash(fragment)}` : ''}`;
        link.addEventListener('click', (event) => {
          if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          selectFile(repoPath, fragment);
        });
      });

      if (state.markdownImageObserver) {
        state.markdownImageObserver.disconnect();
        state.markdownImageObserver = null;
      }

      const markdownImages = Array.from(wrapper.querySelectorAll('img[src]'));
      const loadMarkdownImage = async (img) => {
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';

        const src = img.getAttribute('src') || '';
        if (/^(https?:)?\/\//i.test(src) || src.startsWith('data:') || src.startsWith('blob:')) {
          return;
        }
        const clean = src.split(/[?#]/, 1)[0];
        if (!clean) return;
        try {
          img.src = await resolveMediaUrl(resolveRepoPath(clean, currentDir), signal);
        } catch (_) {}
      };

      const setupMarkdownImages = () => {
        if (!markdownImages.length) return;
        if (!('IntersectionObserver' in window)) {
          markdownImages.forEach((img) => loadMarkdownImage(img));
          return;
        }
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            observer.unobserve(entry.target);
            loadMarkdownImage(entry.target);
          });
        }, {
          root: $('content'),
          rootMargin: '240px 0px',
        });
        state.markdownImageObserver = observer;
        markdownImages.forEach((img) => observer.observe(img));
      };

      $('contentBody').replaceChildren(wrapper);
      setupMarkdownImages();

      const codeBlocks = Array.from(wrapper.querySelectorAll('pre code'));
      if (codeBlocks.length) {
        try {
          await ensureHighlight();
          if (signal.aborted) return;
          codeBlocks.forEach((code) => {
            try { window.hljs.highlightElement(code); } catch (_) { /* plain */ }
          });
        } catch (_) { /* plain */ }
      }

      if (signal.aborted) return;
      if (anchor) scrollToAnchor(anchor);
    };

    const renderCode = async (text, ext) => {
      const code = document.createElement('code');
      code.textContent = text;
      const pre = document.createElement('pre');
      pre.appendChild(code);
      const wrap = document.createElement('div');
      wrap.className = 'source-block';
      wrap.appendChild(pre);
      $('contentBody').replaceChildren(wrap);

      if (ext && text.length <= 500 * 1024) {
        try {
          await ensureHighlight();
          window.hljs.highlightElement(code);
        } catch (_) { /* plain */ }
      }
    };

    const renderHtml = (text, ext) => {
      if (text.length > MAX_HTML_PREVIEW_BYTES) {
        const notice = document.createElement('div');
        notice.className = 'notice warning';
        notice.textContent = `HTML preview is limited to ${formatFileSize(MAX_HTML_PREVIEW_BYTES)}. Use Raw or New Tab to open the complete file.`;
        const wrap = document.createElement('div');
        wrap.className = 'source-block';
        const code = document.createElement('code');
        code.textContent = text;
        const pre = document.createElement('pre');
        pre.appendChild(code);
        wrap.appendChild(pre);
        $('contentBody').replaceChildren(notice, wrap);
        return;
      }
      const url = makeBlobUrl(new Blob([text], { type: 'text/html' }));
      const note = document.createElement('div');
      note.className = 'notice';
      note.textContent = 'Preview is sandboxed: scripts do not run in the embedded view. Use the raw toggle or New Tab for the source/file.';
      const iframe = document.createElement('iframe');
      iframe.className = 'html-frame';
      iframe.setAttribute('sandbox', '');
      iframe.src = url;
      $('contentBody').replaceChildren(note, iframe);
    };

    const renderSvg = (text, name) => {
      const url = makeBlobUrl(new Blob([text], { type: 'image/svg+xml' }));
      const frame = document.createElement('div');
      frame.className = 'media-frame';
      const img = document.createElement('img');
      img.className = 'media-content';
      img.referrerPolicy = 'no-referrer';
      img.src = url;
      img.alt = name;
      frame.appendChild(img);
      $('contentBody').replaceChildren(frame);
    };

    const renderImage = (url, name) => {
      const frame = document.createElement('div');
      frame.className = 'media-frame';
      const img = document.createElement('img');
      img.className = 'media-content';
      img.referrerPolicy = 'no-referrer';
      img.src = url;
      img.alt = name;
      frame.appendChild(img);
      $('contentBody').replaceChildren(frame);
    };

    const renderAudio = (url) => {
      const frame = document.createElement('div');
      frame.className = 'media-frame';
      const audio = document.createElement('audio');
      audio.className = 'media-content';
      audio.controls = true;
      audio.src = url;
      frame.appendChild(audio);
      $('contentBody').replaceChildren(frame);
    };

    const renderVideo = (url) => {
      const frame = document.createElement('div');
      frame.className = 'media-frame';
      const video = document.createElement('video');
      video.className = 'media-content';
      video.controls = true;
      video.src = url;
      frame.appendChild(video);
      $('contentBody').replaceChildren(frame);
    };

    const renderPdf = (url) => {
      const iframe = document.createElement('iframe');
      iframe.className = 'pdf-frame';
      iframe.src = url;
      $('contentBody').replaceChildren(iframe);
    };

    const renderSpreadsheet = async (data, signal) => {
      if (signal.aborted) return;
      if (data.byteLength > MAX_SPREADSHEET_BYTES) {
        const notice = document.createElement('div');
        notice.className = 'notice warning';
        notice.textContent = `Spreadsheet preview is limited to ${formatFileSize(MAX_SPREADSHEET_BYTES)}.`;
        $('contentBody').replaceChildren(notice);
        return;
      }
      await ensureSpreadsheet();
      if (signal.aborted) return;
      try {
        let workbook;
        const ext = extOf(state.currentFilePath);
        if (ext === 'csv') {
          workbook = window.XLSX.read(new TextDecoder().decode(data), { type: 'string' });
        } else {
          workbook = window.XLSX.read(data, { type: 'array' });
        }
        const wrapper = document.createElement('div');
        wrapper.className = 'source-block';
        for (const sheetName of workbook.SheetNames) {
          const section = document.createElement('section');
          section.className = 'sheet';
          section.innerHTML = `<h3>${escapeHTML(sheetName)}</h3>`;
          const raw = window.XLSX.utils.sheet_to_html(workbook.Sheets[sheetName]);
          const clean = window.DOMPurify.sanitize(raw, { USE_PROFILES: { html: true } });
          const holder = document.createElement('div');
          holder.innerHTML = clean;
          section.appendChild(holder.firstElementChild || holder);
          wrapper.appendChild(section);
        }
        $('contentBody').replaceChildren(wrapper);
      } catch (error) {
        const notice = document.createElement('div');
        notice.className = 'notice error';
        notice.textContent = `Failed to parse spreadsheet: ${error.message}`;
        $('contentBody').replaceChildren(notice);
      }
    };

    const setContentHeader = (path, ext, plainTitle = '') => {
      if (!path) {
        $('breadcrumbs').innerHTML = `<span class="crumb-file">${escapeHTML(plainTitle)}</span>`;
        $('fileActions').innerHTML = '';
        return;
      }
      const segments = path.split('/');
      const fileName = segments.pop();
      const links = [];
      let cumulative = '';
      for (const segment of segments) {
        cumulative = cumulative ? `${cumulative}/${segment}` : segment;
        links.push(`<a href="#" data-folder="${escapeHTML(cumulative)}">${escapeHTML(displayName(segment))}</a>`);
      }
      $('breadcrumbs').innerHTML = `${links.join('<span>/</span>')}${links.length ? '<span>/</span>' : ''}<span class="crumb-file">${escapeHTML(displayName(fileName))}</span>`;

      const actions = [];
      const githubUrl = `https://github.com/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}/blob/${encodeURIComponent(state.branch)}/${encodePath(path)}`;
      actions.push(`<a class="file-action" href="${escapeHTML(githubUrl)}" target="_blank" rel="noopener noreferrer" data-action="github"><svg class="ui-icon" aria-hidden="true"><use href="#i-github"></use></svg><span>GitHub</span></a>`);
      const hasToggle = MARKDOWN_EXTS.includes(ext) || ext === 'html' || ext === 'htm' || ext === 'svg';
      const showRaw = getViewPreference(ext) === 'raw';
      if (hasToggle) actions.push(`<button class="file-action" data-action="toggle-view" aria-pressed="${showRaw}"><svg class="ui-icon" aria-hidden="true"><use href="#i-raw"></use></svg><span>${showRaw ? 'Rendered' : 'Raw'}</span></button>`);
      const hasCopy = !NO_COPY_EXTS.includes(ext) || ext === 'svg';
      if (hasCopy) actions.push('<button class="file-action" data-action="copy"><svg class="ui-icon" aria-hidden="true"><use href="#i-copy"></use></svg><span>Copy</span></button>');
      actions.push('<button class="file-action" data-action="print"><svg class="ui-icon" aria-hidden="true"><use href="#i-print"></use></svg><span>Print</span></button>');
      const download = !TAB_VIEWABLE_EXTS.includes(ext) && !(!ext || MARKDOWN_EXTS.includes(ext));
      actions.push(`<button class="file-action" data-action="open" data-download="${download}"><svg class="ui-icon" aria-hidden="true"><use href="#i-external"></use></svg><span>${download ? 'Download' : 'New Tab'}</span></button>`);
      $('fileActions').innerHTML = actions.join('');
    };

    const getViewKey = (ext) => (ext === 'html' || ext === 'htm' ? 'html' : ext);
    const getViewPreference = (ext) => safeGet(localStorage, storageKey(`viewPref:${getViewKey(ext)}`)) || 'rendered';
    const setViewPreference = (ext, value) => safeSet(localStorage, storageKey(`viewPref:${getViewKey(ext)}`), value);

    const resolveMediaUrl = async (path, signal) => {
      const local = localUrlFor(path);
      if (local && !getToken()) return local;
      if (!getToken()) return rawUrl(path);
      return fetchFileBlob(path, undefined, signal);
    };

    const createFileUrl = async (path, signal) => {
      const local = localUrlFor(path);
      if (local && !getToken()) return local;
      if (!getToken()) return rawUrl(path);
      return fetchFileBlob(path, undefined, signal);
    };

    const viewRaw = async (text) => {
      await renderCode(text, extOf(state.currentFilePath));
    };

    const selectFile = async (path, anchor = '', historyMode = 'push') => {
      if (path === state.currentFilePath && anchor) {
        if (historyMode !== 'none') navigateToAppRoute(state.owner, state.repo, state.branch, path, historyMode === 'replace', anchor);
        scrollToAnchor(anchor);
        return;
      } 
      const item = await ensureRepoPath(path);
      if (!item) {
        showError(`File not found in ${state.owner}/${state.repo}.`);
        return;
      }
      state.currentFilePath = path;
      state.activePanel = null;
      updateTopButtonState();
      updateActiveRow(path);
      abortContentRequest();
      const controller = new AbortController();
      requests.content = controller;
      const signal = controller.signal;
      clearBlobUrls();
      const ext = extOf(path);
      setContentHeader(path, ext);
      $('contentBody').innerHTML = '<div class="notice">Loading…</div>';
      lastRawText = null;

      try {
        if (IMAGE_EXTS.includes(ext) && ext !== 'svg') {
          const url = await resolveMediaUrl(path, signal);
          if (signal.aborted) return;
          renderImage(url, path.split('/').pop());
        } else if (AUDIO_EXTS.includes(ext)) {
          const url = await fetchFileBlob(path, ext === 'mp3' ? 'audio/mpeg' : ext === 'wav' ? 'audio/wav' : 'audio/ogg', signal);
          if (signal.aborted) return;
          renderAudio(url);
        } else if (VIDEO_EXTS.includes(ext)) {
          const url = await fetchFileBlob(path, ext === 'mp4' ? 'video/mp4' : 'video/webm', signal);
          if (signal.aborted) return;
          renderVideo(url);
        } else if (ext === 'pdf') {
          const url = await fetchFileBlob(path, 'application/pdf', signal);
          if (signal.aborted) return;
          renderPdf(url);
        } else if (SHEET_EXTS.includes(ext)) {
          const data = await fetchFileArrayBuffer(path, signal);
          if (signal.aborted) return;
          await renderSpreadsheet(data, signal);
        } else {
          const text = await fetchFileText(path, signal);
          if (signal.aborted) return;
          lastRawText = text;
          const rawPreferred = getViewPreference(ext) === 'raw';
          if (rawPreferred && (MARKDOWN_EXTS.includes(ext) || ext === 'html' || ext === 'htm' || ext === 'svg')) {
            viewRaw(text);
          } else if (MARKDOWN_EXTS.includes(ext)) {
            await renderMarkdown(text, path, signal, anchor);
          } else if (ext === 'svg') {
            renderSvg(text, path.split('/').pop());
          } else if (ext === 'html' || ext === 'htm') {
            renderHtml(text, ext);
          } else {
            await renderCode(text, ext);
          }
        }

        if (signal.aborted) return;
        if (historyMode !== 'none') navigateToAppRoute(state.owner, state.repo, state.branch, path, historyMode === 'replace', anchor);
        safeSet(sessionStorage, storageKey(`currentFile:${state.owner}/${state.repo}/${state.branch}`), path);
      } catch (error) {
        if (signal.aborted || error.name === 'AbortError') return;
        showError(error.message, error.status === 403 || error.status === 429);
      }

      if (!(anchor && scrollToAnchor(anchor))) $('content').scrollTo({ top: 0, behavior: 'auto' });
    };

    const scrollToAnchor = (anchor) => {
      if (!anchor) return false;
      const el = $('contentBody').querySelector(`#${CSS.escape(anchor)}, [name="${CSS.escape(anchor)}"]`);
      if (!el) return false;
      el.scrollIntoView({ block: 'start', behavior: 'auto' });
      return true;
    };

    const renderHomeState = (message = '') => {
      abortTreeRequest();
      abortContentRequest();
      state.owner = '';
      state.repo = '';
      state.branch = '';
      state.currentFilePath = '';
      state.tree = null;
      state.treeIndex = new Map();
      state.treeFullyLoaded = false;
      state.rootNode = null;
      state.activePanel = null;
      updateRepoHeader();
      updateBranchControl();
      $('tree').replaceChildren();
      $('fileCount').textContent = '—';
      setContentHeader('', '');
      const fragment = document.createDocumentFragment();
      if (message) {
        const notice = document.createElement('div');
        notice.className = 'notice error';
        notice.setAttribute('role', 'alert');
        notice.textContent = message;
        fragment.appendChild(notice);
      }
      const homeState = $('homeState');
      if (homeState) {
        homeState.hidden = false;
        fragment.appendChild(homeState);
      }
      $('contentBody').replaceChildren(fragment);
      updateFooter();
      safeRemove(localStorage, storageKey('repo'));
      history.replaceState(null, '', `${location.pathname}`);
      hashNavigated = false;
    };

    const showError = (message, tokenHint = false) => {
      const notice = document.createElement('div');
      notice.className = `notice ${tokenHint ? 'warning' : 'error'}`;
      notice.innerHTML = `${escapeHTML(message)}${tokenHint ? '<br><br><button class="secondary-btn" data-action="open-token">Open token settings</button>' : ''}`;
      $('contentBody').replaceChildren(notice);
    };

    const abortContentRequest = () => {
      requests.content?.abort();
      requests.content = null;
      if (state.markdownImageObserver) {
        state.markdownImageObserver.disconnect();
        state.markdownImageObserver = null;
      }
    };

    const abortTreeRequest = () => {
      requests.tree?.abort();
      requests.tree = null;
    };

    const clearRepoCache = () => safeRemove(localStorage, storageKey('repo'));
    const cacheRepo = () => safeSet(localStorage, storageKey('repo'), JSON.stringify({
      owner: state.owner, repo: state.repo, branch: state.branch, updated: state.repoUpdated
    }));

    const detectLocalMode = async () => {
      if (location.protocol !== 'file:') return;
      state.localMode = true;
      try {
        const configResponse = await fetch('./.git/config');
        if (!configResponse.ok) return;
        const configText = await configResponse.text();
        const match = configText.match(/github\.com[:/]+([\w.-]+)\/([\w.-]+?)(?:\.git)?\/?\s*$/im);
        if (!match) return;
        state.localRepo.owner = match[1];
        state.localRepo.repo = match[2];
        try {
          const headResponse = await fetch('./.git/HEAD');
          const headText = headResponse.ok ? (await headResponse.text()).trim() : '';
          state.localRepo.branch = headText.startsWith('ref: refs/heads/') ? headText.slice('ref: refs/heads/'.length) : '';
        } catch (_) { /* use remote */ }
        CONFIG.owner = state.localRepo.owner;
        CONFIG.repo = state.localRepo.repo;
        CONFIG.branch = state.localRepo.branch;
      } catch (_) {
        state.fileAccessBlocked = true;
      }
    };

    const detectRepo = async () => {
      const hasSearchRoute = Boolean(location.search.replace(/^\?/, ''));
      const queryRoute = parseAppRoute();
      if (queryRoute) {
        CONFIG.owner = queryRoute.owner;
        CONFIG.repo = queryRoute.repo;
        CONFIG.branch = queryRoute.branch;
        state.currentFilePath = queryRoute.file || '';
        queryRoute.fromQuery = true;
        return queryRoute;
      }
      if (hasSearchRoute) return { invalid: true };

      const pathRoute = parseRouteString(location.pathname);
      if (pathRoute) {
        CONFIG.owner = pathRoute.owner;
        CONFIG.repo = pathRoute.repo;
        CONFIG.branch = pathRoute.branch;
        state.currentFilePath = pathRoute.file || '';
        return pathRoute;
      }

      return { owner: CONFIG.owner, repo: CONFIG.repo, branch: CONFIG.branch, file: '' };
    };

    const getRepoInfo = async (signal) => {
      const url = `https://api.github.com/repos/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}`;
      const data = await ghApi(url, signal);
      state.defaultBranch = data.default_branch || state.branch;
      state.repoUpdated = data.pushed_at || state.repoUpdated || '';
      if (!state.branch) state.branch = state.defaultBranch;
    };

    const fetchTree = async () => {
      abortTreeRequest();
      state.treeVersion += 1;
      state.rootNode = makeRootNode();
      state.tree = [];
      state.treeIndex = new Map();
      state.treeFullyLoaded = false;

      const controller = new AbortController();
      requests.tree = controller;
      try {
        setContentHeader('', '');
        $('contentBody').innerHTML = '<div class="notice">Loading repository files…</div>';
        if (!state.branch) {
          await getRepoInfo(controller.signal);
        } else {
          state.defaultBranch = state.branch;
        }
        try {
          const jsDelivrTree = await loadTreeFromJsDelivr(controller.signal);
          if (controller.signal.aborted) return;
          mergeRecursiveTree(jsDelivrTree.items, '');
        } catch (jsDelivrError) {
          if (controller.signal.aborted) return;
          const treeData = await ghApi(treeApiUrl(state.branch, true), controller.signal);
          if (controller.signal.aborted) return;
          if (!treeData || !Array.isArray(treeData.tree)) {
            throw new Error('GitHub returned an unexpected tree response.');
          }

          if (treeData.truncated) {
            // GitHub caps recursive tree responses at 100,000 entries or 7 MB.
            // Use the root tree SHA and load each subtree non-recursively as needed.
            state.rootNode = makeRootNode();
            state.rootNode.source = { sha: treeData.sha || '' };
            state.rootNode.loaded = false;
            state.tree = [];
            state.treeIndex = new Map();
            state.treeFullyLoaded = false;
            await loadDirectoryNode(state.rootNode, controller.signal);
            if (!state.rootNode.loaded) {
              throw state.rootNode.loadError || new Error('Unable to load the repository root.');
            }
            $('contentBody').innerHTML = '<div class="notice">Repository tree is larger than GitHub’s recursive response limit; folders load on demand.</div>';
          } else {
            mergeRecursiveTree(treeData.tree, treeData.sha || '');
          }
        }
        renderTree();
        updateRepoHeader();
        updateFooter();
        updateBranchControl();
        cacheRepo();
      } catch (error) {
        if (controller.signal.aborted) return;
        if (error.status === 404) {
          renderHomeState('Repository or branch not found.');
          return;
        }
        const suffix = error.status === 403 || error.status === 429 ? '<br><br><button class="secondary-btn" data-action="open-token">Open token settings</button>' : '';
        const localNote = state.fileAccessBlocked ? '<br><br><strong>Local file access:</strong> your browser blocked the .git/config read. The local-file workflow needs file access enabled for this browser.' : '';
        const treeNotice = document.createElement('div');
        treeNotice.className = 'notice error';
        treeNotice.textContent = error.message;
        $('tree').replaceChildren(treeNotice);
        showError(error.message, Boolean(suffix));
      } finally {
        if (requests.tree === controller) requests.tree = null;
      }
    };

    const updateRepoHeader = () => {
      const label = state.owner && state.repo ? `${state.owner} / ${state.repo}` : CONFIG.appName;
      $('repoTitle').textContent = label;
      $('repoTitle').title = state.repoUpdated ? `Last updated ${new Date(state.repoUpdated).toLocaleString()}` : label;
      document.title = state.owner && state.repo ? `${state.owner} / ${state.repo} · LiteGH` : 'LiteGH';
      syncRepoSearch();
    };

    const updateFooter = () => {
      $('footerText').textContent = state.owner && state.repo
        ? `LiteGH · ${state.owner}/${state.repo} · ${new Date().getFullYear()}`
        : 'LiteGH · Lightweight GitHub repository browser';
      const license = state.tree?.find((item) => item.type === 'blob' && /^(license|licence)(?:\.[^/]+)?$/i.test(item.path));
      const link = $('licenseLink');
      if (license && state.owner && state.repo) {
        link.href = `https://github.com/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}/blob/${encodeURIComponent(state.branch)}/${encodePath(license.path)}`;
        link.hidden = false;
      } else {
        link.hidden = true;
      }
    };

    const updateBranchControl = () => {
      if (!state.branch) {
        $('branchControl').hidden = true;
        return;
      }
      $('branchControl').hidden = false;
      $('btnBranch').textContent = `⎇ ${state.branch}`;
      $('btnBranch').title = `Switch branch · current: ${state.branch}`;
    };

    const openBranchMenu = async () => {
      const menu = $('branchMenu');
      menu.hidden = false;
      $('btnBranch').setAttribute('aria-expanded', 'true');
      menu.innerHTML = '<div class="notice">Loading branches…</div>';
      try {
        if (!branchList) {
          const url = `https://api.github.com/repos/${encodeURIComponent(state.owner)}/${encodeURIComponent(state.repo)}/branches?per_page=100`;
          branchList = await ghApi(url);
        }
        menu.innerHTML = branchList.map((branch) => `<button class="branch-option${branch.name === state.branch ? ' is-current' : ''}" type="button" role="option" data-branch="${escapeHTML(branch.name)}">${branch.name === state.branch ? '✓ ' : ''}${escapeHTML(branch.name)}</button>`).join('');
      } catch (error) {
        menu.innerHTML = `<div class="notice error">${escapeHTML(error.message)}</div>`;
      }
    };

    const closeBranchMenu = () => {
      $('branchMenu').hidden = true;
      $('btnBranch').setAttribute('aria-expanded', 'false');
    };

    const switchBranch = async (branch) => {
      if (!branch || branch === state.branch) {
        closeBranchMenu();
        return;
      }
      closeBranchMenu();
      safeSet(localStorage, storageKey('repo'), JSON.stringify({ owner: state.owner, repo: state.repo, branch }));
      state.branch = branch;
      state.tree = null;
      state.rootNode = null;
      state.treeVersion += 1;
      state.currentFilePath = '';
      branchList = null;
      clearFileMemoryCache();
      clearBlobUrls();
      navigateToAppRoute(state.owner, state.repo, state.branch, '', true);
      hashNavigated = false;
      updateBranchControl();
      await fetchTree();
      autoSelectReadme();
    };

    const autoSelectReadme = async (silent = false) => {
      if (!state.rootNode) return;
      const { anchor } = parseHash();
      const key = storageKey(`currentFile:${state.owner}/${state.repo}/${state.branch}`);
      const saved = safeGet(sessionStorage, key);
      if (saved) {
        const item = await ensureRepoPath(saved);
        if (item) {
          selectFile(saved, '', silent ? 'none' : 'push');
          return;
        }
      }
      const readme = Object.entries(state.rootNode.children).find(([name, item]) => item.type === 'blob' && README_RE.test(name));
      if (readme) {
        selectFile(readme[1].path, anchor, silent ? 'none' : 'push');
        return;
      }
      renderHomeState();
    };

    const getRepoStats = () => {
      if (!state.tree) return null;
      const files = state.tree.filter((item) => item.type === 'blob');
      const folders = state.tree.filter((item) => item.type === 'tree');
      const extCounts = {};
      for (const file of files) {
        const ext = extOf(file.path);
        const label = ext ? `.${ext}` : '(no ext)';
        extCounts[label] = (extCounts[label] || 0) + 1;
      }
      const topTypes = Object.entries(extCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);
      const largest = [...files].sort((a, b) => (b.size || 0) - (a.size || 0)).slice(0, 5);
      const totalSize = files.reduce((sum, file) => sum + (file.size || 0), 0);
      return { fileCount: files.length, folderCount: folders.length, totalSize, topTypes, largest };
    };

    const renderAboutPanel = async (toggleState = true) => {
      if (toggleState) {
        state.activePanel = state.activePanel === 'about' ? null : 'about';
        if (state.activePanel === null) {
          returnToFile();
          return;
        }
      } else {
        state.activePanel = 'about';
      }
      abortContentRequest();
      const stats = getRepoStats();
      setContentHeader('', '', 'About LiteGH');
      updateTopButtonState();
      const tokenStatus = getToken() ? 'Token stored in this browser' : 'No token configured';
      $('contentBody').innerHTML = `
        <div class="info-card">
          <h2>LiteGH</h2>
          <p>A minimal, lightweight GitHub repository browser for older devices in a single HTML file.</p>
          <h3>Repository</h3>
          <ul>
            <li><strong>Repo:</strong> ${escapeHTML(state.owner && state.repo ? `${state.owner}/${state.repo}` : 'not loaded')}</li>
            <li><strong>Branch:</strong> ${escapeHTML(state.branch || '—')}</li>
            <li><strong>Mode:</strong> ${state.localMode ? 'local checkout content + GitHub tree' : 'GitHub'} </li>
            <li><strong>Token:</strong> ${escapeHTML(tokenStatus)}</li>
            <li><strong>Rate limit:</strong> <span id="aboutRate">checking…</span></li>
          </ul>
          ${stats ? `<h3>Loaded tree statistics</h3>
            <ul>
              <li><strong>Loaded files:</strong> ${stats.fileCount}</li>
              <li><strong>Loaded folders:</strong> ${stats.folderCount}</li>
              <li><strong>Total size:</strong> ${formatFileSize(stats.totalSize)}</li>
            </ul>
            <h3>Top file types</h3>
            <ol>${stats.topTypes.map(([type, count]) => `<li>${escapeHTML(type)} — ${count}</li>`).join('')}</ol>
            <h3>Largest files</h3>
            <ol>${stats.largest.map((file) => `<li>${escapeHTML(file.path)} — ${formatFileSize(file.size)}</li>`).join('')}</ol>` : ''}
          <h3>Keyboard shortcuts</h3>
          <ul>
            <li><kbd>Ctrl/⌘ B</kbd> — toggle sidebar</li>
            <li><kbd>/</kbd> — focus the file filter</li>
            <li><kbd>\\</kbd> — focus the sidebar tree</li>
            <li><kbd>↑</kbd> <kbd>↓</kbd> — move through visible files/folders</li>
            <li><kbd>Page Up</kbd> / <kbd>Page Down</kbd> — jump by several visible items</li>
            <li><kbd>Home</kbd> / <kbd>End</kbd> — jump to first/last visible item</li>
            <li><kbd>Esc</kbd> — clear the file filter</li>
          </ul>
          <h3>Other</h3>
          <ul>
            <li>A− / A+ adjusts the root font size in 2px steps while the app itself uses rem units.</li>
            <li>Rendered ↔ Raw preferences are saved per file type.</li>
            <li>Small files are cached in memory and a bounded sessionStorage cache for the current browser session. LiteGH uses one recursive tree request whenever GitHub can return the whole tree; only repositories above GitHub’s recursive response limit load folder subtrees on demand.</li>
          </ul>
          <hr>
          <button class="secondary-btn" data-action="self-test">🧪 Run self-test</button>
        </div>`;
      try {
        const response = await fetch('https://api.github.com/rate_limit', { headers: ghHeaders() });
        const data = response.ok ? await response.json() : null;
        const core = data?.resources?.core;
        if ($('aboutRate')) {
          $('aboutRate').textContent = core ? `${core.remaining} / ${core.limit} remaining` : 'Unable to fetch';
        }
      } catch (_) {
        if ($('aboutRate')) $('aboutRate').textContent = 'Unable to fetch';
      }
    };

    const renderTokenPanel = () => {
      state.activePanel = state.activePanel === 'token' ? null : 'token';
      if (state.activePanel === null) {
        returnToFile();
        return;
      }
      abortContentRequest();
      setContentHeader('', '', 'GitHub token');
      updateTopButtonState();
      const token = getToken();
      $('contentBody').innerHTML = `
        <div class="info-card">
          <h2>GitHub token</h2>
          <p>Optional. A GitHub personal access token enables private repository access (with appropriate permissions) and higher API limits. The token stays in this browser's localStorage and is sent to GitHub only.</p>
          <div class="form-stack">
            <label class="form-label" for="tokenInput">Personal access token</label>
            <div class="token-row">
              <input id="tokenInput" class="form-input" type="password" autocomplete="off" value="${escapeHTML(token)}" placeholder="github_pat_…">
              <button class="secondary-btn" data-action="toggle-token" type="button">Show</button>
              <button class="primary-btn" data-action="save-token" type="button">Save</button>
            </div>
            <div class="notice">Private repositories require a token with at least Contents: Read access for the repository.</div>
            <button class="secondary-btn" data-action="clear-token" type="button">Clear token</button>
            <button class="secondary-btn" data-action="reset-all" type="button">Reset all LiteGH data</button>
          </div>
        </div>`;
      $('tokenInput').focus();

    const returnToFile = () => {
      const path = state.currentFilePath || state.panelReturnPath;
      state.activePanel = null;
      updateTopButtonState();
      if (path) selectFile(path);
      else autoSelectReadme();
